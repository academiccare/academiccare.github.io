  VIEWS.merit = async () => {
    const students = await S.store.students();
    const classes = [...new Set(students.filter(s => s.active).map(s => s.class))].sort((a, b) => a - b);
    const cls = +(S.f.merCls || (isAdmin() ? classes[classes.length - 1] : (students.find(s => s.id === S.kid) || students[0] || {}).class));
    const month = S.f.merMonth || U.monthKey();
    const list = await S.store.meritList(cls, month);
    const mineIds = isAdmin() ? [] : students.map(s => s.id);
    const pub = isAdmin() || S.settings.merit_public !== 'off';
    const top = list.filter(r => r.rank <= (pub ? 999 : 5));
    const mi = list.find(r => r.most_improved);
    const own = list.filter(r => mineIds.includes(r.student_id) && r.rank > 5);
    const medal = r => r <= 3 ? `<span class="medal m${r}">${bn(r)}</span>` : `<span class="medal">${bn(r)}</span>`;
    const row = r => `<div class="item ${mineIds.includes(r.student_id) ? 'me' : ''}" style="cursor:default">${medal(r.rank)}<div class="grow"><div class="t ellip">${esc(r.name)}${mineIds.includes(r.student_id) ? ` <span class="chip ok">${isStudent() ? 'তুমি' : 'আপনার সন্তান'}</span>` : ''}</div><div class="d">${bn(r.exams)}টি পরীক্ষা${r.improve != null ? ' · ' + (r.improve >= 0 ? '▲ ' : '▼ ') + U.pct(Math.abs(r.improve)) : ''}</div></div><div class="score">${U.pct(r.avg_pct)}</div></div>`;
    return `
      ${pageHead('মেধাতালিকা', 'মাসের সব প্রকাশিত পরীক্ষার গড় নম্বর ধরে', '', true)}
      <div class="month-nav"><button data-act="mer-month" data-d="-1" aria-label="আগের মাস">${icon('left')}</button><b>${U.monthLabel(month)}</b><button data-act="mer-month" data-d="1" aria-label="পরের মাস" ${month >= U.monthKey() ? 'disabled' : ''}>${icon('right')}</button></div>
      ${isAdmin() && classes.length > 1 ? `<div class="filters">${classes.map(c => `<button class="${cls == c ? 'on' : ''}" data-act="filter" data-key="merCls" data-val="${c}">${U.cls(c)}</button>`).join('')}</div>` : `<div class="small mut">${U.cls(cls)}</div>`}
      ${mi ? `<div class="card row" style="background:var(--goldl)"><div class="av" style="background:var(--gold);color:#0b3b36">${icon('chart')}</div><div class="grow"><b style="color:var(--goldt)">সবচেয়ে বেশি উন্নতি</b><div class="small">${esc(mi.name)} · আগের মাসের চেয়ে ▲ ${U.pct(mi.improve)}</div></div></div>` : ''}
      <div class="card"><div class="list">${top.length ? top.map(row).join('') : empty('trophy', 'এ মাসে এখনো কোনো প্রকাশিত পরীক্ষা নেই')}</div>
        ${own.length ? `<div class="divider" style="margin:6px 0">${isStudent() ? 'তোমার অবস্থান' : 'আপনার সন্তান'}</div><div class="list">${own.map(row).join('')}</div>` : ''}</div>
      ${isAdmin() ? `<p class="small mut" style="margin:0">${S.settings.merit_public !== 'off' ? 'গার্ডিয়ান আর ছাত্ররা পুরো তালিকা দেখতে পান।' : 'গার্ডিয়ানরা শুধু প্রথম ৫ জন আর নিজের সন্তানের অবস্থান দেখতে পান।'} বদলাতে: আরও → বেতনের সেটিং → রেজাল্ট দেখানো।</p>` : ''}`;
  };

      ${items.map(r => `<div class="row" ${isAdmin() ? `data-act="rt-edit" data-id="${r.id}" style="cursor:pointer"` : ''}><span class="num small" style="min-width:118px;color:var(--mut)">${time12(r.start_time)}${r.end_time ? ' – ' + time12(r.end_time).replace(/ .*/, '') : ''}</span><b class="grow">${esc(r.subject)}</b>${r.batch ? `<span class="chip grey">${esc(r.batch)}</span>` : ''}</div>`).join('')}</div>`; }).join('');
  }

  function routineForm(r) {
    const isNew = !r;
    r = r || { class: S.cache.rtCls, weekday: 0, start_time: '16:00', end_time: '17:00', subject: 'গণিত', batch: '' };
    const days2 = new Set(isNew ? [0, 2, 4] : [r.weekday]);
    openSheet(`<h3>${isNew ? 'রুটিনে ক্লাস যোগ' : 'ক্লাস বদলান'}</h3>
      <div class="stack" id="rf">
        <div class="field"><label>${isNew ? 'কোন কোন দিন' : 'দিন'}</label><div class="filters" style="flex-wrap:wrap" id="rf-days">${WDAYS.map((w, i) => `<button type="button" data-d="${i}" class="${days2.has(i) ? 'on' : ''}">${w.replace('বার', '')}</button>`).join('')}</div></div>
        <div class="grid2"><div class="field"><label for="rf-s">শুরু</label><input id="rf-s" type="time" value="${r.start_time}"></div><div class="field"><label for="rf-e">শেষ</label><input id="rf-e" type="time" value="${r.end_time || ''}"></div></div>
        <div class="grid2"><div class="field"><label for="rf-sub">বিষয়</label><input id="rf-sub" list="rf-subs" value="${esc(r.subject)}"><datalist id="rf-subs">${U.SUBJECTS.map(s => `<option value="${s}">`).join('')}</datalist></div>
          <div class="field"><label for="rf-b">ব্যাচ</label><input id="rf-b" list="sf-batches" value="${esc(r.batch || '')}" placeholder="সকাল / বিকেল"></div></div>
        <div class="acts">${isNew ? '<button class="btn line" data-act="close">বাতিল</button>' : `<button class="btn danger" id="rf-del">${icon('trash')}মুছুন</button>`}<button class="btn" id="rf-go">সংরক্ষণ</button></div>
      </div>`, sh => {
      sh.querySelectorAll('#rf-days button').forEach(b => b.onclick = () => { const d = +b.dataset.d; if (!isNew) days2.clear(); days2.has(d) ? days2.delete(d) : days2.add(d); sh.querySelectorAll('#rf-days button').forEach(x => x.classList.toggle('on', days2.has(+x.dataset.d))); });
      if (!isNew) sh.querySelector('#rf-del').onclick = async () => { await S.store.deleteRoutine(r.id); closeSheet(); U.toast('মুছে ফেলা হয়েছে'); render(true); };
      sh.querySelector('#rf-go').onclick = async ev => {
        const v = id => sh.querySelector(id).value.trim();
        if (!days2.size) return U.toast('অন্তত একটা দিন বাছুন');
        if (!v('#rf-sub') || !v('#rf-s')) return U.toast('বিষয় আর শুরুর সময় দিন');
        await busy(ev.currentTarget, async () => { for (const d of days2) await S.store.saveRoutine({ id: isNew ? undefined : r.id, class: r.class, weekday: d, start_time: v('#rf-s'), end_time: v('#rf-e'), subject: v('#rf-sub'), batch: v('#rf-b') }); });
        closeSheet(); U.toast('রুটিন সংরক্ষণ হয়েছে'); render(true);
      };
    });
  }

        <form id="admf" class="stack" novalidate>
          <div class="field"><label for="ad-name">ছাত্র/ছাত্রীর নাম</label><input id="ad-name" autocomplete="off"></div>
          <div class="grid2">
            <div class="field"><label for="ad-class">শ্রেণি</label><select id="ad-class">${U.CLASS_OPTIONS.map(c => `<option value="${c}" ${c === 5 ? 'selected' : ''}>${U.cls(c)}</option>`).join('')}</select></div>
            <div class="field"><label for="ad-school">স্কুল</label><input id="ad-school"></div>

          <div class="field"><label for="ad-phone">অভিভাবকের মোবাইল</label><input id="ad-phone" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX"></div>
          <div class="field"><label for="ad-note">কিছু জানাতে চাইলে (ঐচ্ছিক)</label><textarea id="ad-note" rows="2" placeholder="যেমন: কোন ব্যাচে পড়াতে চান"></textarea></div>
          <div id="ad-err"></div>

          <button class="btn line block" type="button" data-act="adm-back">ফিরে যান</button>
        </form>`}
      </div>
      <div class="foot">${icon('phone').replace('<svg', '<svg style="width:13px;height:13px;vertical-align:-2px"')} ${bn(U.BRAND_PHONE)}</div>
    </div>`;
    const f = document.getElementById('admf');
    if (f) f.addEventListener('submit', async ev => {
      ev.preventDefault();
      const v = id => f.querySelector(id).value.trim();

      if (v('#ad-name').length < 2) return err.innerHTML = '<div class="err">ছাত্র/ছাত্রীর নাম লিখুন</div>';

      const btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'পাঠানো হচ্ছে…';

  // ---------- খাতা দেখানো (কাগজের পরীক্ষা) ----------
  async function scriptSheet(sid) {
    const e = S.cache.exam, s = S.cache.roster.find(x => x.id === sid);
    const existing = ((await S.store.resultImages(e.id)).find(x => x.student_id === sid) || {}).images || [];
    const files = existing.map(p => ({ path: p }));
    openSheet(`<h3>দেখা খাতার ছবি</h3><div class="small mut" style="margin:-8px 0 12px">${esc(s.name)} · ${esc(e.title)}</div>
      <div class="stack">
        <label class="btn ghost block" for="sc-files">${icon('upload')}খাতার পাতার ছবি তুলুন / যোগ করুন</label>
        <input id="sc-files" type="file" accept="image/*" multiple hidden>
        <div class="thumbs" id="sc-thumbs"></div>
        <span class="small mut">রেজাল্ট প্রকাশ হলে গার্ডিয়ান "খাতা দেখুন" চেপে এই ছবিগুলো দেখবেন।</span>
        <div class="acts"><button class="btn line" data-act="close">বাতিল</button><button class="btn" id="sc-go">${icon('check')}সংরক্ষণ</button></div>
      </div>`, async sh => {
      const draw = async () => {
        const urls = await Promise.all(files.map(f => f.url ? f.url : S.store.imageUrl(f.path)));
        sh.querySelector('#sc-thumbs').innerHTML = urls.map((u, i) => `<div class="thumb"><img src="${esc(u)}" alt="পাতা ${bn(i + 1)}"><button type="button" class="x" data-i="${i}" aria-label="সরান">×</button></div>`).join('');
        sh.querySelectorAll('#sc-thumbs .x').forEach(b => b.onclick = () => { files.splice(+b.dataset.i, 1); draw(); });
      };
      draw();
      sh.querySelector('#sc-files').addEventListener('change', async ev => {
        for (const f of ev.target.files) { const blob = await U.compressImage(f, 1800, 0.75); files.push({ blob, url: URL.createObjectURL(blob) }); }
        ev.target.value = ''; draw();
      });
      sh.querySelector('#sc-go').onclick = async ev => {
        await busy(ev.currentTarget, async () => {
          const paths = [];
          for (const f of files) paths.push(f.path || await S.store.uploadImage(sid, f.blob));
          await S.store.saveResultImages(e.id, sid, paths);
        });
        closeSheet(); U.toast('খাতার ছবি রাখা হয়েছে');
        const btn = mainEl.querySelector(`[data-act=script-open][data-id="${sid}"]`);
        if (btn) { btn.classList.toggle('has', files.length > 0); btn.querySelector('.n').textContent = files.length ? bn(files.length) : ''; }
      };
    });
  }

        if (used.length) await S.store.markQuestionsUsed(used);
        if (d._for === 'new') {
          const fresh = d.questions.filter(q => !q.bank_id).map(q => ({ class: d.class, subject: d.subject, chapter: d.chapter, type: q.type, text: String(q.text).trim(), options: q.type === 'mcq' ? q.options.map(o => String(o).trim()) : null, answer: q.type === 'written' ? '' : String(q.ans).trim(), marks: +q.marks, difficulty: 'medium', source: 'নিজের তৈরি', used_count: 1, last_used: U.today() }));
          if (fresh.length) await S.store.saveQuestions(fresh);
        }
      } catch (e) { }
      S.draft = null; U.toast('টেস্ট সংরক্ষণ হয়েছে, নতুন প্রশ্নগুলো প্রশ্নব্যাংকেও জমা হলো');
      if (S.history.length && S.history[S.history.length - 1].view === 'testAdmin') S.history.pop();
      S.view = 'testAdmin'; S.params = { id: saved.id }; render();
    },
    'test-publish': async el => {
      const t = S.cache.test;
      await busy(el, async () => {
        await S.store.setTestPublished(t.id, true);
        await S.store.notify([{ class: t.class, kind: 'test', title: 'নতুন অনলাইন টেস্ট: ' + t.title, body: `${bn(t.questions.length)}টি প্রশ্ন · ${bn(t.duration_min)} মিনিট${t.due_at ? ' · শেষ সময় ' + dateTimeLabel(t.due_at) : ''}` }]);
      });
      U.toast('প্রকাশ হয়েছে, ছাত্ররা দেখতে পাবে'); render();
    },
    'test-delete': async el => {
      if (!(await confirmSheet('টেস্টটা মুছবেন?', 'ছাত্রদের দেওয়া সব উত্তরও মুছে যাবে।', 'মুছে ফেলুন', true))) return;
      await S.store.deleteTest(el.dataset.id); U.toast('মুছে ফেলা হয়েছে'); back();
    },
    'test-remind': async el => {
      const t = S.cache.test, attempts = await S.store.attempts(t.id);
      const miss = S.cache.students.filter(s => s.active && s.class === t.class && !attempts.some(a => a.student_id === s.id && a.submitted_at));
      await busy(el, () => S.store.notify(miss.map(s => ({ student_id: s.id, kind: 'test', title: 'অনলাইন টেস্ট এখনো দেওয়া হয়নি', body: t.title + (t.due_at ? ' · শেষ সময় ' + dateTimeLabel(t.due_at) : '') }))));
      U.toast(bn(miss.length) + ' জনকে মনে করিয়ে দেওয়া হয়েছে');
    },
    'grade-open': el => go('grade', { id: el.dataset.id }),
    'grade-save': async el => {
      const { attempt: a, test: t, student: st } = S.cache;
      const ws = {};
      for (const i of mainEl.querySelectorAll('[data-w]')) {
        const v = U.en(i.value).trim();
        if (v === '') continue;
        const n = parseFloat(v);
        if (isNaN(n) || n < 0 || n > +i.dataset.max) { i.focus(); return U.toast('নম্বর ০ থেকে ' + U.marks(i.dataset.max) + ' এর মধ্যে দিন'); }
        ws[i.dataset.w] = n;
      }
      const r = await busy(el, () => S.store.gradeAttempt(a.id, ws));
      if (r.checked) await S.store.notify([{ student_id: a.student_id, kind: 'test', title: 'অনলাইন টেস্টের নম্বর: ' + t.title, body: `পেয়েছে ${U.marks(r.total)}/${U.marks(t.total_marks)}` }]);
      U.toast(r.checked ? (st ? st.name : '') + ': নম্বর জানিয়ে দেওয়া হয়েছে' : 'সংরক্ষণ হয়েছে, কিছু প্রশ্নের নম্বর বাকি'); back();
    },
    'hw-form': () => hwForm(),
    'hw-edit': () => hwForm(S.cache.hw),
    'hw-admin': el => go('hwAdmin', { id: el.dataset.id }),
    'hw-delete': async () => {
      if (!(await confirmSheet('হোমওয়ার্ক মুছবেন?', 'ছাত্রদের জমা দেওয়া ছবিও তালিকা থেকে চলে যাবে।', 'মুছে ফেলুন', true))) return;
      await S.store.deleteHomework(S.cache.hw.id); U.toast('মুছে ফেলা হয়েছে'); back();
    },
    'sub-open': el => subSheet(el.dataset.id),
    'hw-remind': async el => {
      const { hw, subs, students } = S.cache;
      const miss = students.filter(s => s.active && s.class === hw.class && !subs.some(x => x.student_id === s.id));
      await busy(el, () => S.store.notify(miss.map(s => ({ student_id: s.id, kind: 'homework', title: 'হোমওয়ার্ক জমা দেওয়া হয়নি', body: hw.title + ' · শেষ দিন ' + U.dateLabel(hw.due_date) }))));
      U.toast(bn(miss.length) + ' জনকে মনে করিয়ে দেওয়া হয়েছে');
    },
    'test-start': async el => {
      const t = (await S.store.tests()).find(x => x.id === el.dataset.id);
      const a = (await S.store.attempts(t.id)).find(x => x.student_id === S.kid);
      if (!a && !(await confirmSheet('টেস্ট শুরু করবে?', `শুরু করলেই ${bn(t.duration_min)} মিনিটের টাইমার চালু হবে, মাঝখানে থামানো যাবে না। সময় শেষ হলে যা লেখা থাকবে, নিজে থেকেই জমা হয়ে যাবে।`, 'শুরু করো'))) return;
      go('take', { id: t.id });
    },
    'test-result': el => go('testResult', { id: el.dataset.id }),
    'take-opt': el => {
      const T = S.take; if (!T) return;
      T.ans[el.dataset.q] = el.dataset.j; U.ls.set('ac-take-' + T.aid, T.ans);
      el.parentElement.querySelectorAll('.opt').forEach(b => b.classList.toggle('on', b === el));
    },
    'take-submit': el => submitTake(el),
    'hw-submit': el => hwSubmitSheet(el.dataset.id),
    'img-view': el => openSheet(`<img src="${esc(el.dataset.src)}" alt="উত্তরের ছবি" style="width:100%;border-radius:12px;display:block"><div class="acts"><button class="btn line" data-act="close">বন্ধ করুন</button></div>`),
    'go-print': () => { S.f.feeMode = 'print'; S.f.feeMonth = U.monthKey(); go('fees', {}, true); },
    'cash-form': el => cashForm(S.cache.students.find(x => x.id === el.dataset.id)),
    'cash-quick': async el => {
      const s = S.cache.students.find(x => x.id === el.dataset.id);
      const p = await busy(el, () => S.store.recordCash(s.id, S.cache.month, s.monthly_fee));
      await S.store.notify([{ student_id: s.id, kind: 'fee', title: 'বেতন পাওয়া গেছে', body: `${U.monthLabel(p.month)} · ${U.money(p.amount)} · হাতে নগদ · রসিদ নং ${bn(p.receipt_no || '')}` }]);
      await render();
      U.toast(`${s.name}: ${U.money(p.amount)} জমা হয়েছে`, 'ভুল হয়েছে', async () => {
        await S.store.deletePayment(p.id); U.toast('ফিরিয়ে নেওয়া হয়েছে'); render();
      });
    },
    remind: async el => {
      const s = S.cache.students.find(x => x.id === el.dataset.id);
      await busy(el, () => S.store.notify([{ student_id: s.id, kind: 'fee', title: 'বেতন দেওয়ার কথা মনে করিয়ে দিচ্ছি', body: `${U.monthLabel(S.cache.month)} মাসের বেতন ${U.money(s.monthly_fee)} এখনো বাকি।` }]));
      closeSheet(); U.toast(s.name + ' এর গার্ডিয়ানকে জানানো হয়েছে');
    },
    'remind-all': async el => {
      const { students, pays, month } = S.cache;
      const due = students.filter(s => s.active && feeStatus(s, month, pays).s === 'due');
      if (!(await confirmSheet('সবাইকে মনে করিয়ে দেবেন?', `${bn(due.length)} জন গার্ডিয়ানের অ্যাপে বকেয়া বেতনের নোটিফিকেশন যাবে।`, 'পাঠান'))) return;
      await busy(el, () => S.store.notify(due.map(s => ({ student_id: s.id, kind: 'fee', title: 'বেতন দেওয়ার কথা মনে করিয়ে দিচ্ছি', body: `${U.monthLabel(month)} মাসের বেতন ${U.money(s.monthly_fee)} এখনো বাকি।` }))));
      U.toast(bn(due.length) + ' জনকে জানানো হয়েছে');
    },
    receipt: async el => {
      const pays = S.cache.pays || await S.store.payments();
      const p = pays.find(x => x.id === el.dataset.id);
      const s = S.cache.kid || S.cache.student || (S.cache.students || []).find(x => x.id === p.student_id);
      openSheet(receiptHtml(p, s) + `<div class="acts"><button class="btn line" data-act="close">বন্ধ করুন</button></div>`);
    },
    pay: el => paySheet(el.dataset.id, el.dataset.month),

    'sheet-form': () => sheetForm(),
    'sheet-open': async el => {
      const s = (S.cache.sheets || []).find(x => x.id === el.dataset.id);
      try {
        const url = await S.store.sheetUrl(s);
        const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
      } catch (e) { U.toast(e.message); }
    },
    'sheet-delete': async el => {
      const s = S.cache.sheets.find(x => x.id === el.dataset.id);
      if (!(await confirmSheet('শিট মুছবেন?', esc(s.title) + ' আর কেউ নামাতে পারবে না।', 'মুছে ফেলুন', true))) return;
      await S.store.deleteSheet(s); U.toast('শিট মুছে ফেলা হয়েছে'); render();
    },
    'notice-form': () => noticeForm(),
    'notice-delete': async el => {
      if (!(await confirmSheet('নোটিশ মুছবেন?', '', 'মুছে ফেলুন', true))) return;
      await S.store.deleteNotice(el.dataset.id); render();
    },
  };

  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACT[el.dataset.act];
    if (!fn) return;
    ev.preventDefault();
    Promise.resolve(fn(el, ev)).catch(e => { if (e && e.message && e.message !== 'bad') U.toast(e.message); });
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeSheet(); });

  boot();
})();

</script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
</body>
</html>

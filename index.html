<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>একাডেমিক কেয়ার</title>
<meta name="theme-color" content="#0b4a43">
<meta name="description" content="একাডেমিক কেয়ার কোচিং: রেজাল্ট, শিট আর বেতনের হিসাব">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="একাডেমিক কেয়ার">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&display=swap">
<style>
/* একাডেমিক কেয়ার · অ্যাপ স্টাইল
   Layout: মোবাইল-প্রথম অ্যাপ শেল — উপরে সবুজ ব্র্যান্ড বার, মাঝে কার্ড-তালিকা, নিচে ট্যাব বার */
:root{
  --g:#0b4a43; --g2:#0e7c6f; --gold:#e8a317; --goldl:#fdf3dc; --goldt:#8a5a00; --head-gold:#fbd27a;
  --bg:#f3f6f5; --card:#ffffff; --ink:#1d2533; --mut:#5b6474; --line:#dfe4ec; --soft:#e3f3f0; --field:#f7f9fa;
  --blue:#1d6fb8; --bluel:#e8f1fb; --rose:#c2410c; --rosel:#fdece3; --vio:#5b3fa8; --viol:#efeafa;
  --ok:#0b7a43; --okl:#e2f5ea;
  --shadow:0 1px 2px rgba(11,74,67,.06),0 4px 14px rgba(11,74,67,.06);
  --font:"Noto Sans Bengali","FreeSans","Nirmala UI","Vrinda",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1615; --card:#132220; --ink:#e6eeec; --mut:#9aaba8; --line:#243835; --soft:#173a35; --field:#0f1c1b;
  --goldl:#3a2e12; --goldt:#f6c24a; --bluel:#14273b; --blue:#7fb6ea; --rosel:#3b1e12; --rose:#f19468;
  --viol:#251d3b; --vio:#b9a5f0; --okl:#123326; --ok:#6fd39c; --g2:#3fb3a3;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1615; --card:#132220; --ink:#e6eeec; --mut:#9aaba8; --line:#243835; --soft:#173a35; --field:#0f1c1b;
  --goldl:#3a2e12; --goldt:#f6c24a; --bluel:#14273b; --blue:#7fb6ea; --rosel:#3b1e12; --rose:#f19468;
  --viol:#251d3b; --vio:#b9a5f0; --okl:#123326; --ok:#6fd39c; --g2:#3fb3a3;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#0b4a43}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- শেল ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(120deg,#0b4a43,#0e7c6f);color:#fff;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px}
.top .lg{width:38px;height:38px;background:#fff;border-radius:11px;padding:2px;flex:none}
.top .lg svg{width:100%;height:100%;display:block}
.top .nm{line-height:1.15;min-width:0}
.top .nm b{display:block;font-size:17px}
.top .nm span{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.top .acts{margin-left:auto;display:flex;gap:6px}
.icon-btn{position:relative;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:21px;height:21px}
.icon-btn .dot{position:absolute;top:5px;right:5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--gold);color:#0b4a43;font-size:11px;font-weight:700;display:grid;place-items:center}

.demo-bar{background:var(--goldl);color:var(--goldt);font-size:13px;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo-bar button{margin-left:auto;border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:2px 10px;font-size:12px;cursor:pointer}

main{max-width:720px;margin:0 auto;padding-block:14px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{border:0;background:transparent;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:11.5px;cursor:pointer}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--g2);font-weight:700}
.tabs button.on svg{stroke-width:2.3}

/* ---------- সাধারণ উপাদান ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-h h2{font-size:17px;color:var(--ink)}
.sec-h .sub{font-size:13px;color:var(--mut)}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.page-h h1{font-size:22px}
.page-h p{margin:2px 0 0;color:var(--mut);font-size:13.5px}
.mut{color:var(--mut)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.wrap{flex-wrap:wrap}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--g2);color:#fff;min-height:44px}
.btn svg{width:18px;height:18px}
.btn.gold{background:var(--gold);color:#0b3b36}
.btn.ghost{background:var(--soft);color:var(--g2)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--rosel);color:var(--rose)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}

.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip.weekly{background:var(--bluel);color:var(--blue)}
.chip.monthly{background:var(--goldl);color:var(--goldt)}
.chip.model{background:var(--viol);color:var(--vio)}
.chip.ok{background:var(--okl);color:var(--ok)}
.chip.due{background:var(--rosel);color:var(--rose)}
.chip.wait{background:var(--goldl);color:var(--goldt)}
.chip.grey{background:var(--field);color:var(--mut);border:1px solid var(--line)}

.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13.5px;cursor:pointer;color:var(--ink)}
.filters button.on{background:var(--g2);border-color:var(--g2);color:#fff;font-weight:700}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.tile .k{font-size:12.5px;color:var(--mut)}
.tile .v{font-size:24px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;font-weight:400;color:var(--mut)}
.tile .s{font-size:12px;color:var(--mut)}
.up{color:var(--ok)} .down{color:var(--rose)}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.item:last-child{border-bottom:0}
.item .t{font-weight:700}
.item .d{font-size:13px;color:var(--mut)}
.item .end{text-align:right;flex:none}
.av{width:42px;height:42px;border-radius:13px;background:var(--soft);color:var(--g2);display:grid;place-items:center;font-weight:700;flex:none;font-size:16px}
.av.gold{background:var(--goldl);color:var(--goldt)}

.score{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.score small{font-size:12px;color:var(--mut);font-weight:400}

.empty{text-align:center;padding:26px 12px;color:var(--mut)}
.empty svg{width:42px;height:42px;opacity:.5;margin-bottom:6px}
.empty b{display:block;color:var(--ink);margin-bottom:2px}

.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{width:18px;height:18px;color:var(--mut)}
.search input{border:0;background:transparent;padding:10px 0;flex:1;min-width:0;outline:none}

.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:19;width:56px;height:56px;border-radius:18px;border:0;background:var(--gold);color:#0b3b36;box-shadow:0 6px 18px rgba(0,0,0,.18);display:grid;place-items:center;cursor:pointer}
.fab svg{width:26px;height:26px}

/* ---------- ফর্ম ---------- */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13.5px;font-weight:700;color:var(--mut)}
.field input,.field select,.field textarea{background:var(--field);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none;min-height:46px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--g2)}
.field .hint{font-size:12.5px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--field);border:1.5px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 4px;font-size:13.5px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--g2);font-weight:700;box-shadow:var(--shadow)}
.err{background:var(--rosel);color:var(--rose);border-radius:10px;padding:9px 12px;font-size:13.5px}

/* ---------- মোডাল (নিচ থেকে ওঠা শিট) ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(5,20,18,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;
  padding-block:8px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  animation:rise .2s ease-out}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-size:18px;margin-bottom:12px}
.sheet .acts{display:flex;gap:8px;margin-top:16px}
.sheet .acts .btn{flex:1}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px}}
@keyframes rise{from{transform:translateY(30px);opacity:.4}}
@keyframes fade{from{opacity:0}}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:#0b4a43;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);animation:rise .2s}

/* ---------- চার্ট ---------- */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--mut);font-size:11px;font-family:var(--font)}
.chart .me{stroke:var(--g2);stroke-width:2.6;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--g2);opacity:.1}
.chart .avg{stroke:var(--gold);stroke-width:2;fill:none;stroke-dasharray:5 4}
.chart .pt{fill:var(--card);stroke:var(--g2);stroke-width:2.2}
.chart .pt.last{fill:var(--g2)}
.chart .lbl{fill:var(--g2);font-size:11.5px;font-weight:700;font-family:var(--font)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

.bars{display:flex;flex-direction:column;gap:9px}
.bar .bl{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:3px}
.bar .bt{height:9px;border-radius:5px;background:var(--field);overflow:hidden;border:1px solid var(--line)}
.bar .bt i{display:block;height:100%;border-radius:5px;background:var(--g2)}
.bar.weak .bt i{background:var(--rose)}
.bar.mid .bt i{background:var(--gold)}

/* ---------- ছাত্র বাছাই (একাধিক সন্তান) ---------- */
.kids{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.kids button{flex:none;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:6px 12px 6px 6px;cursor:pointer}
.kids button.on{border-color:var(--g2);background:var(--soft)}
.kids .av{width:32px;height:32px;font-size:14px;border-radius:10px}

.hero{background:linear-gradient(120deg,#0b4a43,#0e7c6f);color:#fff;border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
.hero h2{font-size:20px}
.hero .meta{opacity:.85;font-size:13.5px}
.hero .big{font-size:34px;font-weight:700;color:var(--head-gold);line-height:1.1;font-variant-numeric:tabular-nums}
.hero .wm{position:absolute;right:-26px;bottom:-30px;width:150px;height:150px;opacity:.12}
.hero .wm svg{width:100%;height:100%}

/* ---------- নম্বর তোলা ---------- */
.mark-row{display:grid;grid-template-columns:minmax(0,1fr) 84px 52px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mark-row:last-child{border-bottom:0}
.mark-row input{width:100%;text-align:center;font-size:17px;font-weight:700;background:var(--field);border:1.5px solid var(--line);border-radius:10px;padding:8px 4px;outline:none;font-variant-numeric:tabular-nums}
.mark-row input:focus{border-color:var(--g2)}
.mark-row input.bad{border-color:var(--rose);background:var(--rosel)}
.mark-row .abs{border:1.5px solid var(--line);background:transparent;border-radius:10px;height:40px;font-size:12px;cursor:pointer;color:var(--mut)}
.mark-row .abs.on{background:var(--rosel);border-color:var(--rose);color:var(--rose);font-weight:700}
.mark-row.isabs input{opacity:.35}

/* ---------- পেমেন্ট ---------- */
.pay-methods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pay-methods button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 4px;cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.pay-methods button .mk{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:12px}
.pay-methods button.on{border-color:var(--g2);background:var(--soft)}
.mk.bkash{background:#d12053}.mk.nagad{background:#ec6b1d}.mk.rocket{background:#8c3494}.mk.cash{background:#0e7c6f}
.paybox{background:var(--field);border:1.5px dashed var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px}
.paybox .no{font-size:20px;font-weight:700;letter-spacing:.5px;font-variant-numeric:tabular-nums}

.receipt{border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.receipt .rh{background:linear-gradient(120deg,#0b4a43,#0e7c6f);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.receipt .rh .lg{width:36px;height:36px;background:#fff;border-radius:10px;padding:2px}
.receipt .rh .lg svg{width:100%;height:100%}
.receipt .rh b{display:block}
.receipt .rb{padding:12px 14px;display:flex;flex-direction:column;gap:6px;position:relative}
.receipt .rb .kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.receipt .rb .kv span:first-child{color:var(--mut)}
.receipt .stamp{position:absolute;right:14px;bottom:12px;border:2.5px solid var(--ok);color:var(--ok);border-radius:10px;padding:2px 10px;font-weight:700;transform:rotate(-8deg);opacity:.85}

.month-nav{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:6px;box-shadow:var(--shadow)}
.month-nav b{flex:1;text-align:center;font-size:16px}
.month-nav button{width:40px;height:40px;border-radius:11px;border:0;background:var(--soft);color:var(--g2);cursor:pointer;display:grid;place-items:center}
.month-nav svg{width:20px;height:20px}

.progress{height:10px;border-radius:6px;background:var(--field);overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--g2)}

.notice{border-left:4px solid var(--gold);padding-left:12px}
.notice .t{font-weight:700}
.notice .d{font-size:13px;color:var(--mut)}

/* ---------- লগইন ---------- */
.login{min-height:100%;display:flex;flex-direction:column}
.login .brand{background:linear-gradient(150deg,#0b4a43,#0e7c6f 70%);color:#fff;padding-block:42px 54px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));text-align:center;position:relative;overflow:hidden}
.login .brand .lg{width:84px;height:84px;margin:0 auto 12px;background:#fff;border-radius:24px;padding:4px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.login .brand .lg svg{width:100%;height:100%}
.login .brand h1{font-size:28px}
.login .brand .en{color:var(--head-gold);letter-spacing:6px;font-size:13px;font-weight:700;margin-top:2px}
.login .brand .tag{opacity:.85;font-size:14px;margin-top:8px}
.login .panel{background:var(--card);margin:-30px auto 24px;width:calc(100% - 32px);max-width:420px;border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;position:relative}
.login .foot{text-align:center;color:var(--mut);font-size:12.5px;padding-bottom:20px}
.demo-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.demo-pick button{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:14px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink)}
.demo-pick button svg{width:30px;height:30px;color:var(--g2)}
.demo-pick button b{font-size:15px}
.demo-pick button span{font-size:12px;color:var(--mut)}
.divider{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12.5px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

.tbl-wrap{overflow-x:auto}

/* ---------- অনলাইন টেস্ট ও হোমওয়ার্ক ---------- */
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:96px;height:120px;border-radius:12px;overflow:hidden;border:1.5px solid var(--line);background:var(--field);padding:0;cursor:pointer;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}

.timerbar svg{width:20px;height:20px;display:block}
.timerbar b{font-size:20px}
.timerbar.low{background:#c2410c}

.selbox{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--card);color:transparent;display:grid;place-items:center;cursor:pointer;flex:none;margin-top:2px;padding:0}

body:has(.selbar) main{padding-bottom:180px}
body:has(.selbar) .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}

    // ---- অনলাইন টেস্ট ----
    async tests() {
      await tick();
      const list = isAdmin() ? db.tests : db.tests.filter(t => t.published && myClasses().includes(t.class));
      return clone(list).sort((a, b) => b.created_at.localeCompare(a.created_at));
    },
    async testKey(id) { need(isAdmin()); return clone(db.test_keys[id] || {}); },
    async saveTest(t, key) {
      need(isAdmin());
      const row = { ...t, total_marks: t.questions.reduce((s, q) => s + (+q.marks || 0), 0) };
      if (row.id) Object.assign(db.tests.find(x => x.id === row.id), row);
      else { row.id = U.uid(); row.published = false; row.created_at = new Date().toISOString(); db.tests.push(row); }
      db.test_keys[row.id] = key; save(); return clone(row);
    },
    async deleteTest(id) { need(isAdmin()); db.tests = db.tests.filter(x => x.id !== id); db.test_attempts = db.test_attempts.filter(a => a.test_id !== id); delete db.test_keys[id]; save(); },
    async setTestPublished(id, v) { need(isAdmin()); db.tests.find(x => x.id === id).published = v; save(); },
    async attempts(testId) {
      await tick();
      const ids = mine().map(s => s.id);
      return clone(db.test_attempts.filter(a => (!testId || a.test_id === testId) && ids.includes(a.student_id)));
    },
    async startTest(tid, sid) {
      need(mine().some(s => s.id === sid));
      const t = db.tests.find(x => x.id === tid);
      let a = db.test_attempts.find(x => x.test_id === tid && x.student_id === sid);
      if (a) return clone(a);
      if (t.due_at && new Date() > new Date(t.due_at)) throw new Error('এই টেস্টের সময় শেষ হয়ে গেছে');
      a = { id: U.uid(), test_id: tid, student_id: sid, started_at: new Date().toISOString(), submitted_at: null, answers: {}, images: {}, auto_score: null, written_scores: {}, total: null, checked: false };
      db.test_attempts.push(a); save(); return clone(a);
    },
    async submitTest(tid, sid, ans, imgs) {
      need(mine().some(s => s.id === sid));
      const a = db.test_attempts.find(x => x.test_id === tid && x.student_id === sid);
      if (!a) throw new Error('আগে টেস্ট শুরু করুন');
      if (a.submitted_at) return clone(a);
      const t = db.tests.find(x => x.id === tid), key = db.test_keys[tid] || {};
      let auto = 0, hasW = false;
      t.questions.forEach(q => { if (q.type === 'written') hasW = true; else if (U.answerMatches(q, ans[q.id], key[q.id])) auto += +q.marks || 1; });
      Object.assign(a, { submitted_at: new Date().toISOString(), answers: ans, images: imgs, auto_score: auto, total: auto, checked: !hasW });
      save(); return clone(a);
    },
    async testReview(tid, sid) {
      const a = db.test_attempts.find(x => x.test_id === tid && x.student_id === sid);
      need(isAdmin() || (a && a.submitted_at && mine().some(s => s.id === sid)));
      return clone(db.test_keys[tid] || {});
    },
    async gradeAttempt(id, written_scores) {
      need(isAdmin());
      const a = db.test_attempts.find(x => x.id === id);
      a.written_scores = written_scores;
      a.total = (a.auto_score || 0) + Object.values(written_scores).reduce((t, v) => t + (+v || 0), 0);
      const t = db.tests.find(x => x.id === a.test_id);
      a.checked = t.questions.filter(q => q.type === 'written').every(q => written_scores[q.id] != null && written_scores[q.id] !== '');
      save(); return clone(a);
    },

    // ---- ছবি (উত্তর ও হোমওয়ার্ক) ----
    async uploadImage(studentId, blob) {
      need(isAdmin() || mine().some(s => s.id === studentId));
      return await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
    },
    async imageUrl(path) { return path; },

    // ---- হোমওয়ার্ক ----
    async homework() {
      await tick();
      const list = isAdmin() ? db.homework : db.homework.filter(h => myClasses().includes(h.class));
      return clone(list).sort((a, b) => b.created_at.localeCompare(a.created_at));
    },
    async saveHomework(h) {
      need(isAdmin());
      if (h.id) Object.assign(db.homework.find(x => x.id === h.id), h);
      else { h = { ...h, id: U.uid(), created_at: new Date().toISOString() }; db.homework.push(h); }
      save(); return clone(h);
    },
    async deleteHomework(id) { need(isAdmin()); db.homework = db.homework.filter(x => x.id !== id); db.homework_submissions = db.homework_submissions.filter(x => x.homework_id !== id); save(); },
    async submissions(hwId) {
      await tick();
      const ids = mine().map(s => s.id);
      return clone(db.homework_submissions.filter(x => (!hwId || x.homework_id === hwId) && ids.includes(x.student_id)));
    },
    async submitHomework(sub) {
      need(mine().some(s => s.id === sub.student_id));
      let x = db.homework_submissions.find(y => y.homework_id === sub.homework_id && y.student_id === sub.student_id);
      if (x && x.status === 'checked') throw new Error('শিক্ষক এটা দেখে ফেলেছেন, আর বদলানো যাবে না');
      if (x) Object.assign(x, { images: sub.images, note: sub.note, submitted_at: new Date().toISOString() });
      else { x = { id: U.uid(), ...sub, submitted_at: new Date().toISOString(), status: 'submitted', marks: null, comment: null, checked_at: null }; db.homework_submissions.push(x); }
      save(); return clone(x);
    },
    async checkSubmission(id, marks, comment) {
      need(isAdmin());
      const x = db.homework_submissions.find(y => y.id === id);
      Object.assign(x, { status: 'checked', marks, comment, checked_at: new Date().toISOString() }); save(); return clone(x);
    },


    // ---- প্রশ্নব্যাংক ----
    async questions() { need(isAdmin()); await tick(); return clone(db.questions || []); },
    async saveQuestion(q) {
      need(isAdmin());
      db.questions = db.questions || [];
      if (q.id) { Object.assign(db.questions.find(x => x.id === q.id), q); }
      else { q = { used_count: 0, last_used: null, ...q, id: U.uid(), created_at: new Date().toISOString() }; db.questions.unshift(q); }
      save(); return clone(q);
    },
    async saveQuestions(list) {
      need(isAdmin());
      const rows = list.map(q => ({ used_count: 0, last_used: null, ...q, id: U.uid(), created_at: new Date().toISOString() }));
      db.questions = rows.concat(db.questions || []); save(); return clone(rows);
    },
    async deleteQuestion(id) { need(isAdmin()); db.questions = db.questions.filter(x => x.id !== id); save(); },
    async markQuestionsUsed(ids) {
      need(isAdmin());
      (db.questions || []).forEach(q => { if (ids.includes(q.id)) { q.used_count = (q.used_count || 0) + 1; q.last_used = U.today(); } });
      save();
    },


    // ---- হাজিরা ----
    async attendance({ day, month } = {}) {
      await tick();
      const ids = mine().map(s => s.id);
      return clone((db.attendance || []).filter(a => ids.includes(a.student_id) && (!day || a.day === day) && (!month || a.day.startsWith(month))));
    },
    async saveAttendance(day, rows) {
      need(isAdmin());
      db.attendance = (db.attendance || []).filter(a => !(a.day === day && rows.some(r => r.student_id === a.student_id)))
        .concat(rows.map(r => ({ day, student_id: r.student_id, status: r.status, marked_at: new Date().toISOString() })));
      save();
    },

    // ---- রিপোর্ট কার্ড ও মেধাতালিকা ----
    async reportComment(sid, month) { need(isAdmin() || mine().some(s => s.id === sid)); return (db.report_comments || {})[sid + '|' + month] || ''; },
    async saveReportComment(sid, month, comment) { need(isAdmin()); db.report_comments = db.report_comments || {}; if (comment) db.report_comments[sid + '|' + month] = comment; else delete db.report_comments[sid + '|' + month]; save(); },
    async meritList(cls, month) {
      need(isAdmin() || myClasses().includes(+cls));
      const prev = U.monthShift(month, -1);
      const per = (sid, m) => {
        const rs = db.results.filter(r => r.student_id === sid && !r.absent).map(r => ({ r, e: db.exams.find(e => e.id === r.exam_id) }))
          .filter(x => x.e && x.e.published && x.e.class == cls && x.e.exam_date.startsWith(m));
        return rs.length ? { pct: rs.reduce((t, x) => t + x.r.marks * 100 / x.e.full_marks, 0) / rs.length, n: rs.length } : null;
      };
      let rows = db.students.filter(s => s.active && s.class == cls).map(s => { const c = per(s.id, month), p = per(s.id, prev); return c ? { student_id: s.id, name: s.name, avg_pct: Math.round(c.pct * 10) / 10, exams: c.n, improve: p ? Math.round((c.pct - p.pct) * 10) / 10 : null } : null; }).filter(Boolean);
      rows.sort((a, b) => b.avg_pct - a.avg_pct);
      rows.forEach(r => r.rank = rows.findIndex(x => x.avg_pct === r.avg_pct) + 1);
      const mi = Math.max(...rows.map(r => r.improve).filter(v => v > 0), -Infinity);
      rows.forEach(r => r.most_improved = r.improve != null && r.improve === mi);
      const ids = mine().map(s => s.id);
      const pub = (db.settings.merit_public || 'on') === 'on';
      return clone(rows.filter(r => isAdmin() || pub || r.rank <= 5 || ids.includes(r.student_id) || r.most_improved));
    },
    async examRanking(eid) {
      const e = db.exams.find(x => x.id === eid);
      if (!e || !e.published || !(isAdmin() || ((db.settings.merit_public || 'on') === 'on' && myClasses().includes(e.class)))) return [];
      const rs = db.results.filter(r => r.exam_id === eid).map(r => ({ student_id: r.student_id, name: (db.students.find(s => s.id === r.student_id) || {}).name || '', marks: r.marks, absent: r.absent }));
      const pres = rs.filter(r => !r.absent).sort((a, b) => b.marks - a.marks);
      pres.forEach(r => r.rank = pres.findIndex(x => x.marks === r.marks) + 1);
      return clone(pres.concat(rs.filter(r => r.absent)));
    },

    // ---- রুটিন ----
    async routine() {
      await tick();
      const list = isAdmin() ? db.routine : (db.routine || []).filter(r => myClasses().includes(r.class));
      return clone(list).sort((a, b) => a.weekday - b.weekday || a.start_time.localeCompare(b.start_time));
    },
    async saveRoutine(r) {
      need(isAdmin());
      if (r.id) Object.assign(db.routine.find(x => x.id === r.id), r);
      else { r = { ...r, id: U.uid(), created_at: new Date().toISOString() }; db.routine.push(r); }
      save(); return clone(r);
    },
    async deleteRoutine(id) { need(isAdmin()); db.routine = db.routine.filter(x => x.id !== id); save(); },

    // ---- ভর্তি ----
    async submitAdmission(a) { (db.admissions = db.admissions || []).unshift({ ...a, id: U.uid(), status: 'new', created_at: new Date().toISOString() }); save(); },
    async admissions() { need(isAdmin()); return clone(db.admissions || []); },
    async setAdmissionStatus(id, status) { need(isAdmin()); db.admissions.find(x => x.id === id).status = status; save(); },

    // ---- খাতা দেখানো ----
    async resultImages(examId) {
      await tick();
      const ids = mine().map(s => s.id);
      return clone((db.result_images || []).filter(x => (!examId || x.exam_id === examId) && ids.includes(x.student_id)
        && (isAdmin() || (db.exams.find(e => e.id === x.exam_id) || {}).published)));
    },
    async saveResultImages(exam_id, student_id, images) {
      need(isAdmin());
      db.result_images = (db.result_images || []).filter(x => !(x.exam_id === exam_id && x.student_id === student_id));
      if (images.length) db.result_images.push({ exam_id, student_id, images });
      save();
    },

    // ---- ফোনে নোটিফিকেশন (ডেমোতে শুধু দেখানো) ----
    pushSupported() { return true; },
    async pushEnabled() { return !!U.ls.get('ac-demo-push', false); },
    async enablePush() { U.ls.set('ac-demo-push', true); return 'demo'; },

    // ---- সেটিংস ----
    async settings() { return clone(Object.assign({ fee_due_day: '5', fee_reminders: 'on', merit_public: 'on' }, db.settings)); },
    async saveSettings(s) { need(isAdmin()); Object.assign(db.settings, s); save(); },
  };

  window.DemoStore = Store;
})();

/* আসল ডাটা স্টোর: Supabase (ফ্রি সার্ভার) — js/config.js-এ লিংক ও কি বসালে চালু হয় */
(function () {
  function make(url, key) {
    const sb = window.supabase.createClient(url, key, { auth: { persistSession: true, autoRefreshToken: true } });
    const EMAIL_DOMAIN = '@academiccare.app';
    let me = null;

    const ok = ({ data, error }) => { if (error) throw friendly(error); return data; };
    function friendly(e) {
      const m = (e && (e.message || e.error_description)) || String(e);
      if (/Invalid login credentials/i.test(m)) return new Error('মোবাইল নম্বর বা পাসওয়ার্ড ভুল');
      if (/already registered|already been registered/i.test(m)) return new Error('এই নম্বরে আগেই অ্যাকাউন্ট খোলা হয়েছে, লগইন করুন');
      if (/payments_trx_unique|duplicate key/i.test(m)) return new Error('এই ট্রানজেকশন আইডি আগেই জমা হয়েছে');
      if (/Password should be/i.test(m)) return new Error('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন');
      if (/Failed to fetch|NetworkError/i.test(m)) return new Error('ইন্টারনেট সংযোগ নেই, আবার চেষ্টা করুন');
      if (/row-level security/i.test(m)) return new Error('এই কাজের অনুমতি নেই');
      return new Error(m);
    }

    async function loadProfile() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { me = null; return null; }
      const p = ok(await sb.from('profiles').select('role, phone, name, student_id').eq('id', session.user.id).maybeSingle());
      me = p ? { role: p.role, phone: p.phone, name: p.name, student_id: p.student_id } : null;
      return me;
    }

    const Store = {
      mode: 'live',
      async session() { return me || loadProfile(); },

      async signIn(phone, password) {
        ok(await sb.auth.signInWithPassword({ email: phone + EMAIL_DOMAIN, password }));
        const p = await loadProfile();
        if (!p) throw new Error('অ্যাকাউন্ট পাওয়া যায়নি');
        return p;
      },
      async signUp(phone, password, name) {
        const allowed = ok(await sb.rpc('can_register', { ph: phone }));
        if (!allowed) throw new Error('এই নম্বরটা কোনো ছাত্রের গার্ডিয়ান নম্বর হিসেবে নেই। শিক্ষকের সাথে যোগাযোগ করুন।');
        const r = await sb.auth.signUp({ email: phone + EMAIL_DOMAIN, password, options: { data: { phone, name } } });
        ok(r);
        if (!r.data.session) ok(await sb.auth.signInWithPassword({ email: phone + EMAIL_DOMAIN, password }));
        return loadProfile();
      },
      async signInStudent(code, password) {
        ok(await sb.auth.signInWithPassword({ email: 'st' + code + EMAIL_DOMAIN, password }));
        const p = await loadProfile();
        if (!p) throw new Error('অ্যাকাউন্ট পাওয়া যায়নি');
        return p;
      },
      async signUpStudent(code, password) {
        const allowed = ok(await sb.rpc('can_register_student', { code }));
        if (!allowed) throw new Error('এই ছাত্র কোড দিয়ে অ্যাকাউন্ট খোলা যাবে না। কোডটা ভুল, অথবা আগেই অ্যাকাউন্ট খোলা হয়েছে।');
        const r = await sb.auth.signUp({ email: 'st' + code + EMAIL_DOMAIN, password, options: { data: { student_code: code } } });
        ok(r);
        if (!r.data.session) ok(await sb.auth.signInWithPassword({ email: 'st' + code + EMAIL_DOMAIN, password }));
        return loadProfile();
      },
      async signOut() { await sb.auth.signOut(); me = null; },

      // ---- ছাত্র ----
      async students() { return ok(await sb.from('students').select('*').order('class').order('roll', { nullsFirst: false })); },
      async saveStudent(s) {
        const row = { name: s.name, class: s.class, batch: s.batch || null, roll: s.roll || null, school: s.school || null, guardian_name: s.guardian_name || null, guardian_phone: s.guardian_phone, monthly_fee: s.monthly_fee || 0, active: s.active !== false };
        if (s.id) ok(await sb.from('students').update(row).eq('id', s.id));
        else ok(await sb.from('students').insert(row));
      },
      async deleteStudent(id) { ok(await sb.from('students').delete().eq('id', id)); },

      // ---- পরীক্ষা ----
      async exams() { return ok(await sb.from('exams').select('*').order('exam_date', { ascending: false }).order('created_at', { ascending: false })); },
      async saveExam(e) {
        const row = { title: e.title, type: e.type, class: e.class, subject: e.subject, chapter: e.chapter || null, full_marks: e.full_marks, exam_date: e.exam_date };
        if (e.id) return ok(await sb.from('exams').update(row).eq('id', e.id).select().single());
        return ok(await sb.from('exams').insert(row).select().single());
      },
      async deleteExam(id) { ok(await sb.from('exams').delete().eq('id', id)); },
      async examResults(examId) { return ok(await sb.from('results').select('*').eq('exam_id', examId)); },
      async saveResults(examId, rows) {
        ok(await sb.from('results').delete().eq('exam_id', examId));
        if (rows.length) ok(await sb.from('results').insert(rows.map(r => ({ exam_id: examId, student_id: r.student_id, marks: r.absent ? null : r.marks, absent: !!r.absent }))));
      },
      async allResults() {
        // বড় হলে পাতায় পাতায় আনে
        let all = [], from = 0;
        for (;;) {
          const part = ok(await sb.from('results').select('*').range(from, from + 999));
          all = all.concat(part); if (part.length < 1000) break; from += 1000;
        }
        return all;
      },
      async setPublished(examId, v) { ok(await sb.from('exams').update({ published: v }).eq('id', examId)); },
      async report(studentId) {
        const rows = ok(await sb.rpc('student_report', { sid: studentId }));
        return rows.map(r => ({ ...r, marks: r.marks == null ? null : Number(r.marks), full_marks: Number(r.full_marks), pct: r.pct == null ? null : Number(r.pct), class_avg: r.class_avg == null ? null : Number(r.class_avg), top_pct: r.top_pct == null ? null : Number(r.top_pct) }));
      },

      // ---- শিট ----
      async sheets() { return ok(await sb.from('sheets').select('*').order('created_at', { ascending: false })); },
      async uploadSheet(file, meta) {
        const ext = (file.name.split('.').pop() || 'pdf').toLowerCase().replace(/[^a-z0-9]/g, '');
        const path = (meta.class || 'all') + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 7) + '.' + ext;
        ok(await sb.storage.from('sheets').upload(path, file, { contentType: file.type || 'application/pdf', upsert: false }));
        return ok(await sb.from('sheets').insert({ title: meta.title, class: meta.class || null, subject: meta.subject || null, file_path: path, file_size: file.size }).select().single());
      },
      async deleteSheet(s) {
        await sb.storage.from('sheets').remove([s.file_path]);
        ok(await sb.from('sheets').delete().eq('id', s.id));
      },
      async sheetUrl(s) {
        const safe = s.title.replace(/[\\/:*?"<>|]/g, ' ').trim() + '.' + (s.file_path.split('.').pop() || 'pdf');
        const d = ok(await sb.storage.from('sheets').createSignedUrl(s.file_path, 3600, { download: safe }));
        return d.signedUrl;
      },

      // ---- বেতন ----
      async payments(month) {
        let q = sb.from('payments').select('*').order('created_at', { ascending: false });
        if (month) q = q.eq('month', month);
        return ok(await q);
      },
      async submitPayment(p) {
        const row = ok(await sb.from('payments').insert({ student_id: p.student_id, month: p.month, amount: p.amount, method: p.method, trx_id: String(p.trx_id).trim().toUpperCase() }).select().single());
        sb.functions.invoke('notify', { body: { mode: 'payment', id: row.id } }).catch(() => {});
        return row;
      },
      async setPaymentStatus(id, status) { return ok(await sb.from('payments').update({ status, verified_at: new Date().toISOString() }).eq('id', id).select().single()); },
      async recordCash(student_id, month, amount) {
        return ok(await sb.from('payments').insert({ student_id, month, amount, method: 'cash', status: 'approved', verified_at: new Date().toISOString() }).select().single());
      },
      async deletePayment(id) { ok(await sb.from('payments').delete().eq('id', id)); },

      // ---- নোটিশ ও নোটিফিকেশন ----
      async notices() { return ok(await sb.from('notices').select('*').order('created_at', { ascending: false }).limit(100)); },
      async saveNotice(n) { return ok(await sb.from('notices').insert({ title: n.title, body: n.body || null, class: n.class || null }).select().single()); },
      async deleteNotice(id) { ok(await sb.from('notices').delete().eq('id', id)); },
      async notifications() { return ok(await sb.from('notifications').select('*').order('created_at', { ascending: false }).limit(60)); },

        } catch (e) { return renderLogin(mode, e.message, who); }
      }
      const phone = U.phone(f.querySelector('#lf-phone').value);
      if (!phone) return renderLogin(mode, 'মোবাইল নম্বরটা ঠিক নেই। ১১ সংখ্যার নম্বর দিন, যেমন 01712345678');
      if (pass.length < 6) return renderLogin(mode, 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন');
      const btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'অপেক্ষা করুন…';
      try {
        if (mode === 'up') {
          const name = f.querySelector('#lf-name').value.trim();
          if (pass !== f.querySelector('#lf-pass2').value) throw new Error('দুই পাসওয়ার্ড মিলছে না');
          S.user = await S.store.signUp(phone, pass, name);
        } else S.user = await S.store.signIn(phone, pass);
        startApp();
      } catch (e) { renderLogin(mode, e.message); }
    });
  }

  // ================= অ্যাপ শেল =================
  const ADMIN_TABS = [['dash', 'home', 'হোম'], ['students', 'users', 'ছাত্র'], ['exams', 'exam', 'পরীক্ষা'], ['fees', 'wallet', 'বেতন'], ['more', 'more', 'আরও']];
  const GUARD_TABS = [['ghome', 'home', 'হোম'], ['gresults', 'chart', 'রেজাল্ট'], ['gstudy', 'file', 'পড়া'], ['gfees', 'wallet', 'বেতন'], ['gnews', 'megaphone', 'নোটিশ']];
  const STUDENT_TABS = [['ghome', 'home', 'হোম'], ['gstudy', 'file', 'পড়া'], ['gresults', 'chart', 'রেজাল্ট'], ['gnews', 'megaphone', 'নোটিশ']];
  const isStudent = () => S.user && S.user.role === 'student';
  const seenKey = () => 'ac-seen-' + (S.user.phone || S.user.student_id);

  async function startApp() {
    S.history = []; S.kid = null;
    try { S.settings = await S.store.settings(); } catch (e) { S.settings = {}; }
    const tabs = isAdmin() ? ADMIN_TABS : isStudent() ? STUDENT_TABS : GUARD_TABS;
    root.innerHTML = `
      <header class="top">
        <div class="lg">${U.LOGO}</div>
        <div class="nm"><b>একাডেমিক কেয়ার</b><span>${isAdmin() ? 'শিক্ষকের প্যানেল' : isStudent() ? 'ছাত্র · ' + esc(S.user.name || '') : 'অভিভাবক · ' + esc(S.user.name || U.phoneFmt(S.user.phone))}</span></div>
        <div class="acts">
          ${isAdmin() ? '' : `<button class="icon-btn" data-act="tab" data-view="gnews" aria-label="নোটিফিকেশন">${icon('bell')}<span class="dot" id="bell-dot" hidden></span></button>`}
          <button class="icon-btn" data-act="logout" aria-label="লগআউট">${icon('logout')}</button>
        </div>
      </header>
      ${isDemo() ? `<div class="demo-bar">${icon('clock').replace('<svg', '<svg style="width:15px;height:15px"')}<span>ডেমো মোড · সব তথ্য নমুনা, শুধু এই ফোনে থাকে</span><button data-act="demo-reset">নতুন করে শুরু</button></div>` : ''}
      <main id="main"></main>
      <nav class="tabs" aria-label="প্রধান মেনু" style="grid-template-columns:repeat(${tabs.length},1fr)">${tabs.map(([v, ic, l]) => `<button data-act="tab" data-view="${v}" id="tab-${v}">${icon(ic)}<span>${l}</span></button>`).join('')}</nav>`;
    mainEl = document.getElementById('main');
    go(tabs[0][0], {}, true);
    refreshBell();
    if (S.store.onNotification && !isAdmin()) S.store.onNotification(() => { refreshBell(); U.toast('নতুন নোটিফিকেশন এসেছে'); });
  }

  function go(view, params = {}, isTab = false) {
    if (isTab) S.history = [];
    else if (S.view) S.history.push({ view: S.view, params: S.params });
    S.view = view; S.params = params;
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === (isTab ? view : (S.history[0] || {}).view || view)));
    render();
  }
  function back() {
    const h = S.history.pop();
    if (!h) return;
    S.view = h.view; S.params = h.params; render();
  }
  async function render(keepScroll) {
    const v = VIEWS[S.view];
    const y = window.scrollY;
    if (!keepScroll) mainEl.innerHTML = `<div class="empty">লোড হচ্ছে…</div>`;
    try {
      const html = await v(S.params);
      mainEl.innerHTML = html;
      if (v.after) v.after(S.params);
      window.scrollTo(0, keepScroll ? y : 0);
    } catch (e) {
      console.error(e);
      mainEl.innerHTML = `<div class="empty">${icon('x')}<b>সমস্যা হয়েছে</b>${esc(e.message)}<br><br><button class="btn sm" data-act="reload">আবার চেষ্টা করুন</button></div>`;
    }
  }
  const pageHead = (title, sub = '', right = '', withBack = false) => `
    <div class="page-h">
      <div class="row grow">${withBack ? `<button class="btn ghost sm" data-act="back" aria-label="ফিরে যান" style="min-height:40px;padding:0 10px">${icon('back')}</button>` : ''}
        <div class="grow"><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div></div>${right}</div>`;
  const empty = (ic, t, d) => `<div class="empty">${icon(ic)}<b>${t}</b>${d || ''}</div>`;

  // ================= মোডাল =================
  function openSheet(html, mount) {
    closeSheet();
    const el = document.createElement('div');
    el.className = 'scrim'; el.id = 'scrim';
    el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
    el.addEventListener('click', e => { if (e.target === el) closeSheet(); });
    document.body.appendChild(el);
    document.body.style.overflow = 'hidden';
    if (mount) mount(el.querySelector('.sheet'));
    return el.querySelector('.sheet');
  }
  function closeSheet() { const s = document.getElementById('scrim'); if (s) s.remove(); document.body.style.overflow = ''; if (S.onSheetClose) { const f = S.onSheetClose; S.onSheetClose = null; f(); } }
  function confirmSheet(title, msg, okLabel = 'হ্যাঁ', danger = false) {
    return new Promise(res => {
      openSheet(`<h3>${title}</h3><p class="mut" style="margin:0">${msg}</p>
        <div class="acts"><button class="btn line" id="cf-no">না</button><button class="btn ${danger ? 'danger' : ''}" id="cf-yes">${okLabel}</button></div>`, sh => {

  async function busy(btn, fn) {

    try { return await fn(); } catch (e) { U.toast(e.message); throw e; } finally { if (btn.isConnected) { btn.disabled = false; btn.innerHTML = old; } }
  }

  // ================= সাধারণ হিসাব =================
  const ordinal = n => {
    if (n == null) return '–';
    const m = { 1: 'ম', 2: 'য়', 3: 'য়', 4: 'র্থ', 5: 'ম', 6: 'ষ্ঠ', 7: 'ম', 8: 'ম', 9: 'ম', 10: 'ম' };
    return bn(n) + (m[n] || 'তম');
  };
  const typeChip = t => `<span class="chip ${t}">${U.EXAM_TYPES[t]}</span>`;
  function feeStatus(student, month, pays) {
    const p = pays.filter(x => x.student_id === student.id && x.month === month);
    const ap = p.find(x => x.status === 'approved');
    if (ap) return { s: 'paid', p: ap };
    const pe = p.find(x => x.status === 'pending');
    if (pe) return { s: 'pending', p: pe };
    return { s: 'due', p: null };
  }
  const dueDay = () => Math.min(28, Math.max(1, +(S.settings.fee_due_day || 5)));
  const onTime = p => p && p.status === 'approved' && U.dhakaDay(p.created_at) <= p.month + '-' + String(dueDay()).padStart(2, '0');
  async function pushCard() {
    try { if (!S.store.pushSupported || await S.store.pushEnabled()) return ''; } catch (e) { return ''; }
    return `<div class="card row" style="background:var(--soft)">
      <div class="av" style="background:var(--card)">${icon('bell')}</div>
      <div class="grow"><b>ফোনে নোটিফিকেশন চালু করুন</b><div class="small mut">${isAdmin() ? 'কেউ অনলাইনে বেতন জমা দিলে সাথে সাথে জানবেন' : 'রেজাল্ট, শিট, নোটিশ আর বেতনের খবর ফোনে বাজবে'}</div></div>
      <button class="btn sm" data-act="push-enable">চালু করুন</button></div>`;
  }
  const feeChip = st => st.s === 'paid' ? '<span class="chip ok">দিয়েছে</span>' : st.s === 'pending' ? '<span class="chip wait">যাচাই বাকি</span>' : '<span class="chip due">বাকি</span>';

  // ================= গ্রাফ (নিজস্ব SVG) =================
  function lineChart(rows) {
    const pts = rows.filter(r => !r.absent && r.pct != null);
    if (pts.length < 2) return `<div class="empty small">গ্রাফ দেখাতে অন্তত দুটো পরীক্ষার নম্বর দরকার</div>`;
    const W = 340, H = 190, L = 30, R = 14, T = 16, B = 26;
    const x = i => L + (pts.length === 1 ? 0 : i * (W - L - R) / (pts.length - 1));
    const y = v => T + (100 - v) * (H - T - B) / 100;
    let g = '';
    [0, 25, 50, 75, 100].forEach(v => { g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${bn(v)}</text>`; });
    const step = Math.ceil(pts.length / 6);
    pts.forEach((p, i) => { if (i % step === 0 || i === pts.length - 1) g += `<text class="axis" x="${x(i)}" y="${H - 6}" text-anchor="middle">${U.dateShort(p.exam_date)}</text>`; });
    const avgPts = pts.map((p, i) => p.class_avg == null ? null : `${x(i)},${y(p.class_avg)}`).filter(Boolean);
    const line = pts.map((p, i) => `${x(i)},${y(p.pct)}`).join(' ');
    const area = `M${x(0)},${y(0)} L${line.replace(/ /g, ' L')} L${x(pts.length - 1)},${y(0)} Z`;
    const last = pts[pts.length - 1], li = pts.length - 1;
    const dots = pts.map((p, i) => `<circle class="pt ${i === li ? 'last' : ''}" cx="${x(i)}" cy="${y(p.pct)}" r="${i === li ? 4.5 : 3.2}"><title>${esc(p.title)}: ${U.pct(p.pct)}</title></circle>`).join('');
    const lx = Math.min(x(li), W - R - 18), ly = y(last.pct) < T + 14 ? y(last.pct) + 18 : y(last.pct) - 10;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="পরীক্ষার নম্বরের শতকরা গ্রাফ">
      ${g}<path class="area" d="${area}"/>
      ${avgPts.length > 1 ? `<polyline class="avg" points="${avgPts.join(' ')}"/>` : ''}
      <polyline class="me" points="${line}"/>${dots}
      <text class="lbl" x="${lx}" y="${ly}" text-anchor="middle">${U.pct(last.pct)}</text></svg>`;
  }

  // একজন ছাত্রের রিপোর্ট (গার্ডিয়ান হোম ও শিক্ষকের ছাত্র পাতায় একই)
  function reportStats(rows) {
    const done = rows.filter(r => !r.absent && r.pct != null);
    const avg = done.length ? done.reduce((t, r) => t + r.pct, 0) / done.length : null;
    const recent = done.slice(-3), prev = done.slice(-6, -3);
    const ra = recent.length ? recent.reduce((t, r) => t + r.pct, 0) / recent.length : null;
    const pa = prev.length ? prev.reduce((t, r) => t + r.pct, 0) / prev.length : null;
    const best = done.reduce((b, r) => !b || r.pct > b.pct ? r : b, null);
    const bySub = {};
    done.forEach(r => { const k = r.subject; (bySub[k] = bySub[k] || []).push(r.pct); });
    const subjects = Object.entries(bySub).map(([k, a]) => ({ k, v: a.reduce((t, x) => t + x, 0) / a.length, n: a.length })).sort((a, b) => b.v - a.v);
    const byCh = {};
    done.filter(r => r.type === 'weekly' && r.chapter).forEach(r => { (byCh[r.chapter] = byCh[r.chapter] || []).push(r.pct); });
    const weak = Object.entries(byCh).map(([k, a]) => ({ k, v: a.reduce((t, x) => t + x, 0) / a.length })).filter(x => x.v < 65).sort((a, b) => a.v - b.v).slice(0, 3);
    return { done, avg, ra, pa, trend: ra != null && pa != null ? ra - pa : null, best, subjects, weak, absents: rows.filter(r => r.absent).length, last: done[done.length - 1] };
  }

  function reportBlock(rows, filterKey) {
    const ft = S.f[filterKey] || 'all';
    const shown = ft === 'all' ? rows : rows.filter(r => r.type === ft);
    const st = reportStats(rows);
    if (!rows.length) return `<div class="card">${empty('chart', 'এখনো কোনো রেজাল্ট নেই', 'পরীক্ষার নম্বর প্রকাশ হলে এখানে গ্রাফ দেখা যাবে')}</div>`;
    const tr = st.trend;
    return `
      <div class="tiles four">
        <div class="tile"><div class="k">গড় নম্বর</div><div class="v">${U.pct(st.avg)}</div><div class="s">${bn(st.done.length)}টি পরীক্ষা</div></div>
        <div class="tile"><div class="k">উন্নতি</div><div class="v ${tr == null ? '' : tr >= 0 ? 'up' : 'down'}">${tr == null ? '–' : (tr >= 0 ? '▲ ' : '▼ ') + U.pct(Math.abs(tr))}</div><div class="s">আগের ৩টার তুলনায়</div></div>
        <div class="tile"><div class="k">সর্বশেষ অবস্থান</div><div class="v">${st.last && st.last.rank ? ordinal(st.last.rank) : '–'}${st.last && st.last.total ? ` <small>/ ${bn(st.last.total)}</small>` : ''}</div><div class="s ellip">${st.last ? esc(st.last.subject) : ''}</div></div>
        <div class="tile"><div class="k">সেরা নম্বর</div><div class="v">${st.best ? U.pct(st.best.pct) : '–'}</div><div class="s ellip">${st.best ? esc(st.best.chapter || st.best.subject) : ''}</div></div>
      </div>
      <div class="card stack">
        <div class="sec-h"><h2>নম্বরের গ্রাফ</h2><span class="sub">শতকরা হিসাবে</span></div>
        <div class="filters">${[['all', 'সব'], ['weekly', 'সাপ্তাহিক'], ['monthly', 'মাসিক'], ['model', 'মডেল টেস্ট']].map(([k, l]) => `<button class="${ft === k ? 'on' : ''}" data-act="filter" data-key="${filterKey}" data-val="${k}">${l}</button>`).join('')}</div>
        ${lineChart(shown)}
        <div class="legend"><span><i style="background:var(--g2)"></i>${isStudent() ? 'তুমি' : isAdmin() ? 'এই ছাত্র' : 'আপনার সন্তান'}</span><span><i style="background:var(--gold)"></i>ক্লাসের গড়</span></div>
      </div>
      ${st.subjects.length ? `<div class="card stack">
        <div class="sec-h"><h2>বিষয়ভিত্তিক গড়</h2></div>
        <div class="bars">${st.subjects.map(s => `<div class="bar ${s.v < 60 ? 'weak' : s.v < 75 ? 'mid' : ''}"><div class="bl"><span>${esc(s.k)}</span><b class="num">${U.pct(s.v)}</b></div><div class="bt"><i style="width:${Math.max(3, s.v)}%"></i></div></div>`).join('')}</div>
      </div>` : ''}
      ${st.weak.length ? `<div class="card stack" style="background:var(--rosel)">
        <div class="sec-h"><h2 style="color:var(--rose)">যেসব অধ্যায়ে আরও যত্ন দরকার</h2></div>
        <div class="small">${st.weak.map(w => `<div class="row" style="justify-content:space-between;padding:3px 0"><span>${esc(w.k)}</span><b class="num">${U.pct(w.v)}</b></div>`).join('')}</div>
      </div>` : ''}`;
  }

  function resultItem(r) {
    return `<button class="item" data-act="result-detail" data-id="${r.exam_id}">
      <div class="grow"><div class="row wrap" style="gap:6px">${typeChip(r.type)}<span class="d">${U.dateLabel(r.exam_date)}</span></div>
        <div class="t ellip" style="margin-top:3px">${esc(r.title)}</div><div class="d">${esc(r.subject)}</div></div>
      <div class="end">${r.absent ? '<span class="chip due">অনুপস্থিত</span>' : `<div class="score">${U.marks(r.marks)}<small>/${U.marks(r.full_marks)}</small></div><div class="d">${r.rank ? ordinal(r.rank) + ' / ' + bn(r.total) : ''}</div>`}</div>

  function resultDetail(r) {
    openSheet(`<div class="row wrap" style="gap:6px;margin-bottom:6px">${typeChip(r.type)}<span class="mut small">${U.dateLabel(r.exam_date)}</span></div>
      <h3>${esc(r.title)}</h3>

        <div class="tile"><div class="k">প্রাপ্ত নম্বর</div><div class="v">${U.marks(r.marks)} <small>/ ${U.marks(r.full_marks)}</small></div><div class="s">${U.pct(r.pct)}</div></div>
        <div class="tile"><div class="k">ক্লাসে অবস্থান</div><div class="v">${ordinal(r.rank)} <small>/ ${bn(r.total)}</small></div><div class="s">জন পরীক্ষা দিয়েছে</div></div>
        <div class="tile"><div class="k">ক্লাসের গড়</div><div class="v">${U.pct(r.class_avg)}</div></div>

        } catch (e) { }
        try {
          const im = ((await S.store.resultImages(r.exam_id)).find(x => x.student_id === sid) || {}).images || [];
          if (im.length) sh.querySelector('#rd-script').innerHTML = `<div class="sec-h" style="margin:6px 0 8px"><h2 style="font-size:15px">দেখা খাতা</h2><span class="sub">ছবিতে চাপলে বড় হবে</span></div><div class="thumbs">${await imgsHtml(im)}</div>`;
        } catch (e) { }

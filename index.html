  }

  // ================= ভিউ =================
  const VIEWS = {};

  // ---------- শিক্ষক: ড্যাশবোর্ড ----------
  VIEWS.dash = async () => {
    const mk = U.monthKey();
    const [students, pays, exams, expenses, charges, attempts, subs] = await Promise.all([S.store.students(), S.store.payments(mk), S.store.exams(), S.store.expenses(mk), S.store.charges(mk), S.store.attempts(), S.store.submissions()]);
    const toCheckT = attempts.filter(a => a.submitted_at && !a.checked).length, toCheckH = subs.filter(x => x.status !== 'checked').length;
    const [admNew, attToday] = await Promise.all([S.store.admissions().then(l => l.filter(a => a.status === 'new')).catch(() => []), S.store.attendance({ day: U.today() }).catch(() => [])]);
    const active = students.filter(s => s.active);
    const spent = expenses.reduce((t, e) => t + e.amount, 0);
    const printGot = charges.filter(c => c.paid).reduce((t, c) => t + c.amount, 0);
    const st = active.map(s => feeStatus(s, mk, pays));
    const paid = st.filter(x => x.s === 'paid');
    const collected = paid.reduce((t, x) => t + x.p.amount, 0);
    const expected = active.reduce((t, s) => t + (s.monthly_fee || 0), 0);
    const dueList = active.filter((s, i) => st[i].s !== 'paid');
    const dueAmt = dueList.reduce((t, s) => t + (s.monthly_fee || 0), 0);
    const pending = pays.filter(p => p.status === 'pending');
    const unpublished = exams.filter(e => !e.published);
    const sName = id => (students.find(s => s.id === id) || {}).name || '';
    const byClass = {};
    active.forEach(s => byClass[s.class] = (byClass[s.class] || 0) + 1);
    S.cache = { students };
    const d = new Date();
    return `
      ${pageHead('আজকের হিসাব', `${U.bn(d.getDate())} ${U.MONTHS[d.getMonth()]}, ${bn(d.getFullYear())}`)}
      ${await pushCard()}
      <div class="tiles four">
        <div class="tile"><div class="k">মোট ছাত্র-ছাত্রী</div><div class="v">${bn(active.length)}</div><div class="s ellip">${Object.entries(byClass).map(([c, n]) => U.cls(+c).replace(' শ্রেণি', '') + ' ' + bn(n)).join(' · ')}</div></div>
        <div class="tile"><div class="k">এ মাসে আদায়</div><div class="v">${U.money(collected)}</div><div class="s">${bn(paid.length)} জন দিয়েছে</div></div>
        <div class="tile"><div class="k">বেতন বাকি</div><div class="v down">${bn(dueList.length)} <small>জন</small></div><div class="s">${U.money(dueAmt)}</div></div>
        <div class="tile"><div class="k">যাচাই বাকি</div><div class="v" style="color:var(--goldt)">${bn(pending.length)}</div><div class="s">বিকাশ/নগদ/রকেট</div></div>
      </div>
      <div class="card stack">
        <div class="sec-h"><h2>এ মাসের আদায়</h2><span class="sub num">${U.money(collected)} / ${U.money(expected)}</span></div>
        <div class="progress"><i style="width:${expected ? Math.min(100, collected * 100 / expected) : 0}%"></i></div>
      </div>
      <button class="card stack" data-act="go-print" style="border:0;text-align:left;cursor:pointer;color:inherit;font:inherit">
        <div class="sec-h"><h2>এ মাসের আয়-ব্যয়</h2>${icon('right').replace('<svg', '<svg style="width:18px;color:var(--mut)"')}</div>
        <div class="small" style="display:grid;gap:4px">
          <div class="row" style="justify-content:space-between"><span class="mut">বেতন আদায়</span><b class="num">${U.money(collected)}</b></div>
          <div class="row" style="justify-content:space-between"><span class="mut">ছাপার টাকা আদায়</span><b class="num">${U.money(printGot)}</b></div>
          <div class="row" style="justify-content:space-between"><span class="mut">ছাপার খরচ</span><b class="num down">− ${U.money(spent)}</b></div>
          <div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:6px"><b>হাতে থাকল</b><b class="num" style="font-size:17px">${U.money(collected + printGot - spent)}</b></div>
        </div>
      </button>
      ${pending.length ? `<div class="card stack">
        <div class="sec-h"><h2>বেতন যাচাই করুন</h2><span class="sub">নিজের ফোনের SMS-এর সাথে মিলিয়ে নিন</span></div>
        <div class="list">${pending.map(p => pendingRow(p, sName(p.student_id))).join('')}</div></div>` : ''}
      ${admNew.length ? `<button class="card row" data-act="go" data-view="admissions" style="border:0;text-align:left;cursor:pointer;color:inherit;font:inherit;background:var(--goldl)"><div class="av" style="background:var(--gold);color:#0b3b36">${icon('family')}</div><div class="grow"><b style="color:var(--goldt)">${bn(admNew.length)}টি নতুন ভর্তির আবেদন</b><div class="small">${admNew.slice(0, 2).map(a => esc(a.student_name) + ' · ' + U.cls(a.class)).join(', ')}</div></div>${icon('right').replace('<svg', '<svg style="width:18px;color:var(--mut)"')}</button>` : ''}
      ${new Date().getDay() !== 5 && !attToday.length ? `<button class="card row" data-act="go-att" style="border:0;text-align:left;cursor:pointer;color:inherit;font:inherit"><div class="av">${icon('check')}</div><div class="grow"><b>আজকের হাজিরা নেওয়া হয়নি</b><div class="small mut">QR স্ক্যান করে বা নামে চেপে নিন</div></div>${icon('right').replace('<svg', '<svg style="width:18px;color:var(--mut)"')}</button>` : ''}
      ${toCheckT || toCheckH ? `<div class="card stack">
        <div class="sec-h"><h2>খাতা দেখা বাকি</h2></div>
        <div class="grid2">
          ${toCheckT ? `<button class="btn ghost" data-act="go-exmode" data-m="online">${icon('exam')}অনলাইন টেস্ট ${bn(toCheckT)}</button>` : ''}
          ${toCheckH ? `<button class="btn ghost" data-act="go-exmode" data-m="hw">${icon('edit')}হোমওয়ার্ক ${bn(toCheckH)}</button>` : ''}
        </div></div>` : ''}
      ${unpublished.length ? `<div class="card stack">
        <div class="sec-h"><h2>নম্বর তোলা বাকি</h2></div>
        <div class="list">${unpublished.map(e => `<button class="item" data-act="exam-open" data-id="${e.id}">
          <div class="av gold">${icon('edit')}</div><div class="grow"><div class="t ellip">${esc(e.title)}</div><div class="d">${U.cls(e.class)} · ${U.dateLabel(e.exam_date)}</div></div>${icon('right').replace('<svg', '<svg style="width:18px;color:var(--mut)"')}</button>`).join('')}</div></div>` : ''}
      <div class="card stack">
        <div class="sec-h"><h2>দ্রুত কাজ</h2></div>
        <div class="grid2">
          <button class="btn ghost" data-act="student-form">${icon('plus')}নতুন ছাত্র</button>
          <button class="btn ghost" data-act="exam-form">${icon('exam')}নতুন পরীক্ষা</button>
          <button class="btn ghost" data-act="sheet-form">${icon('upload')}শিট আপলোড</button>
          <button class="btn ghost" data-act="notice-form">${icon('megaphone')}নোটিশ দিন</button>
          <button class="btn ghost" data-act="go-bank">${icon('search')}প্রশ্নব্যাংক</button>
          <button class="btn ghost" data-act="expense-form">${icon('receipt')}ছাপার খরচ</button>
        </div>
      </div>`;
  };
  const pendingRow = (p, name) => `<div class="item" style="cursor:default">
      <div class="av" style="background:transparent;padding:0"><span class="mk ${p.method}" style="width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700">${U.METHODS[p.method]}</span></div>
      <div class="grow"><div class="t ellip">${esc(name)}</div><div class="d num">${U.money(p.amount)} · ${U.monthLabel(p.month)}</div><div class="d num" style="user-select:all">TrxID: <b>${esc(p.trx_id)}</b></div></div>
      <div class="row" style="gap:6px"><button class="btn danger sm" data-act="pay-reject" data-id="${p.id}" aria-label="বাতিল">${icon('x')}</button><button class="btn sm" data-act="pay-approve" data-id="${p.id}">${icon('check')}পেয়েছি</button></div>
    </div>`;

  // ---------- শিক্ষক: ছাত্র তালিকা ----------
  VIEWS.students = async () => {
    if ((S.f.stuMode || 'list') === 'att') return attendanceView();
    const mk = U.monthKey();
    const [students, pays] = await Promise.all([S.store.students(), S.store.payments(mk)]);
    S.cache = { students };
    const cf = S.f.stuClass || 'all', q = (S.f.stuQ || '').trim();
    const classes = [...new Set(students.map(s => s.class))].sort((a, b) => a - b);
    const list = students.filter(s => (cf === 'all' || s.class == cf) && (!q || s.name.includes(q) || s.guardian_phone.includes(U.en(q)) || (s.guardian_name || '').includes(q)));
    return `
      ${pageHead('ছাত্র-ছাত্রী', `মোট ${bn(students.filter(s => s.active).length)} জন`)}
      ${stuSeg('list')}
      <label class="search">${icon('search')}<input id="stu-q" placeholder="নাম বা ফোন নম্বর দিয়ে খুঁজুন" value="${esc(q)}"></label>
      <div class="filters"><button class="${cf === 'all' ? 'on' : ''}" data-act="filter" data-key="stuClass" data-val="all">সব</button>${classes.map(c => `<button class="${cf == c ? 'on' : ''}" data-act="filter" data-key="stuClass" data-val="${c}">${U.cls(c)}</button>`).join('')}</div>
      <div class="card"><div class="list">
        ${list.length ? list.map(s => `<button class="item" data-act="student-open" data-id="${s.id}">
          <div class="av">${esc(U.initial(s.name))}</div>
          <div class="grow"><div class="t ellip">${esc(s.name)}${s.active ? '' : ' <span class="chip grey">বন্ধ</span>'}</div><div class="d">${U.cls(s.class)}${s.roll ? ' · রোল ' + bn(s.roll) : ''}${s.batch ? ' · ' + esc(s.batch) : ''}</div><div class="d num">${U.phoneFmt(s.guardian_phone)}</div></div>
          <div class="end">${s.active ? feeChip(feeStatus(s, mk, pays)) : ''}</div></button>`).join('')
        : empty('users', students.length ? 'কাউকে পাওয়া যায়নি' : 'এখনো কোনো ছাত্র যোগ করা হয়নি', students.length ? '' : 'নিচের + বোতাম চেপে প্রথম ছাত্র যোগ করুন')}
      </div></div>
      <button class="fab" data-act="student-form" aria-label="নতুন ছাত্র">${icon('plus')}</button>`;
  };
  VIEWS.students.after = () => {
    const i = document.getElementById('stu-q');
    if (!i) return;
    let t; i.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { S.f.stuQ = i.value; render().then(() => { const n = document.getElementById('stu-q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }); }, 350); });
  };

  // ---------- শিক্ষক: একজন ছাত্রের পাতা ----------
  VIEWS.student = async ({ id }) => {
    const students = await S.store.students();
    const s = students.find(x => x.id === id);
    if (!s) return empty('users', 'ছাত্রটি পাওয়া যায়নি');
    S.cache = { students, student: s };
    const [rows, pays] = await Promise.all([S.store.report(id), S.store.payments()]);
    S.cache.report = rows;
    const my = pays.filter(p => p.student_id === id && p.status !== 'rejected');
    return `
      ${pageHead(esc(s.name), `${U.cls(s.class)}${s.roll ? ' · রোল ' + bn(s.roll) : ''}${s.batch ? ' · ' + esc(s.batch) : ''}`, '', true)}
      <div class="card stack">
        <div class="row"><div class="av">${icon('family')}</div><div class="grow"><div class="t"><b>${esc(s.guardian_name || 'গার্ডিয়ান')}</b></div><div class="num" id="gph">${U.phoneFmt(s.guardian_phone)}</div></div>
          <button class="btn ghost sm" data-act="copy" data-text="${s.guardian_phone}" data-target="gph">${icon('copy')}কপি</button></div>
        <div class="row small mut">মাসিক বেতন: <b class="num" style="color:var(--ink)">${U.money(s.monthly_fee)}</b>${s.login_code ? `<span class="grow"></span>ছাত্র কোড: <b class="num" style="color:var(--ink);letter-spacing:1px">${bn(s.login_code)}</b>` : ''}</div>
        <div class="grid2"><button class="btn line sm" data-act="student-form" data-id="${s.id}">${icon('edit')}তথ্য বদলান</button><button class="btn danger sm" data-act="student-delete" data-id="${s.id}">${icon('trash')}মুছে ফেলুন</button></div>
        <button class="btn ghost sm" data-act="go-report" data-id="${s.id}">${icon('receipt')}মাসিক রিপোর্ট কার্ড ও মন্তব্য</button>
      </div>
      ${reportBlock(rows, 'repA')}
      ${rows.length ? `<div class="card"><div class="sec-h"><h2>সব রেজাল্ট</h2></div><div class="list">${rows.slice().reverse().map(resultItem).join('')}</div></div>` : ''}
      <div class="card"><div class="sec-h"><h2>বেতনের ইতিহাস</h2></div><div class="list">
        ${my.length ? my.map(p => `<button class="item" data-act="receipt" data-id="${p.id}"><div class="grow"><div class="t">${U.monthLabel(p.month)}</div><div class="d">${U.METHODS[p.method]}${p.trx_id ? ' · ' + esc(p.trx_id) : ''}</div></div><div class="end"><div class="num"><b>${U.money(p.amount)}</b></div>${p.status === 'approved' ? '<span class="chip ok">পরিশোধ</span>' : '<span class="chip wait">যাচাই বাকি</span>'}</div></button>`).join('') : empty('wallet', 'এখনো কোনো বেতন জমা হয়নি')}
      </div></div>`;
  };

  function studentForm(s) {
    s = s || { class: S.f.stuClass && S.f.stuClass !== 'all' ? +S.f.stuClass : 5, active: true, monthly_fee: '' };
    openSheet(`<h3>${s.id ? 'ছাত্রের তথ্য বদলান' : 'নতুন ছাত্র যোগ করুন'}</h3>
      <form id="sf" class="stack" novalidate>
        <div class="field"><label for="sf-name">ছাত্র/ছাত্রীর নাম</label><input id="sf-name" required value="${esc(s.name || '')}"></div>
        <div class="grid2">
          <div class="field"><label for="sf-class">শ্রেণি</label><select id="sf-class">${U.CLASS_OPTIONS.map(c => `<option value="${c}" ${s.class == c ? 'selected' : ''}>${U.cls(c)}</option>`).join('')}</select></div>
          <div class="field"><label for="sf-roll">রোল</label><input id="sf-roll" inputmode="numeric" value="${s.roll ? bn(s.roll) : ''}"></div>
        </div>
        <div class="grid2">
          <div class="field"><label for="sf-batch">ব্যাচ</label><input id="sf-batch" list="sf-batches" placeholder="সকাল / বিকেল" value="${esc(s.batch || '')}"><datalist id="sf-batches"><option value="সকাল"><option value="বিকেল"><option value="সন্ধ্যা"></datalist></div>
          <div class="field"><label for="sf-fee">মাসিক বেতন (৳)</label><input id="sf-fee" inputmode="numeric" value="${s.monthly_fee !== '' ? bn(s.monthly_fee) : ''}"></div>
        </div>
        <div class="field"><label for="sf-gname">গার্ডিয়ানের নাম</label><input id="sf-gname" value="${esc(s.guardian_name || '')}"></div>
        <div class="field"><label for="sf-gphone">গার্ডিয়ানের মোবাইল</label><input id="sf-gphone" inputmode="tel" placeholder="01XXXXXXXXX" value="${esc(s.guardian_phone || '')}"><span class="hint">এই নম্বর দিয়েই গার্ডিয়ান অ্যাপে অ্যাকাউন্ট খুলবেন। ভাইবোনের জন্য একই নম্বর দিন।</span></div>
        ${s.id ? `<label class="row small"><input type="checkbox" id="sf-active" ${s.active ? 'checked' : ''} style="width:20px;height:20px"> এখনো পড়ছে (বন্ধ করলে বেতনের হিসাবে আসবে না)</label>` : ''}
        <div id="sf-err"></div>
        <div class="acts"><button type="button" class="btn line" data-act="close">বাতিল</button><button class="btn" type="submit">সংরক্ষণ</button></div>
      </form>`, sh => {
      const f = sh.querySelector('#sf');
      f.addEventListener('submit', async ev => {
        ev.preventDefault();
        const val = id => f.querySelector(id).value.trim();
        const phone = U.phone(val('#sf-gphone'));
        const errEl = f.querySelector('#sf-err');
        if (!val('#sf-name')) return errEl.innerHTML = '<div class="err">নাম লিখুন</div>';
        if (!phone) return errEl.innerHTML = '<div class="err">গার্ডিয়ানের মোবাইল নম্বরটা ঠিক নেই (১১ সংখ্যা)</div>';
        const row = { id: s.id, name: val('#sf-name'), class: +val('#sf-class'), roll: +U.en(val('#sf-roll')) || null, batch: val('#sf-batch'), monthly_fee: +U.en(val('#sf-fee')) || 0, guardian_name: val('#sf-gname'), guardian_phone: phone, active: s.id ? f.querySelector('#sf-active').checked : true };
        await busy(f.querySelector('button[type=submit]'), () => S.store.saveStudent(row));
        if (S.pendingAdmission && !s.id) { await S.store.setAdmissionStatus(S.pendingAdmission, 'accepted').catch(() => {}); S.pendingAdmission = null; }
        closeSheet(); U.toast(s.id ? 'তথ্য সংরক্ষণ হয়েছে' : row.name + ' ভর্তি হয়েছে'); render();
      });
    });
  }

  // ---------- শিক্ষক: পরীক্ষা ----------
  VIEWS.exams = async () => {
    const mode = S.f.exMode || 'paper';
    if (mode === 'online') return onlineTestsAdmin();
    if (mode === 'hw') return homeworkAdmin();
    const [exams, results] = await Promise.all([S.store.exams(), S.store.allResults()]);
    const ft = S.f.exType || 'all', fc = S.f.exClass || 'all';
    const classes = [...new Set(exams.map(e => e.class))].sort((a, b) => a - b);
    const list = exams.filter(e => (ft === 'all' || e.type === ft) && (fc === 'all' || e.class == fc));
    const avgOf = e => { const r = results.filter(x => x.exam_id === e.id && !x.absent); return r.length ? r.reduce((t, x) => t + x.marks, 0) * 100 / r.length / e.full_marks : null; };
    return `
      ${pageHead('পরীক্ষা', `সাপ্তাহিক, মাসিক ও মডেল টেস্টের নম্বর`)}
      ${examSeg('paper')}
      <div class="filters">${[['all', 'সব'], ['weekly', 'সাপ্তাহিক'], ['monthly', 'মাসিক'], ['model', 'মডেল টেস্ট']].map(([k, l]) => `<button class="${ft === k ? 'on' : ''}" data-act="filter" data-key="exType" data-val="${k}">${l}</button>`).join('')}</div>
      ${classes.length > 1 ? `<div class="filters"><button class="${fc === 'all' ? 'on' : ''}" data-act="filter" data-key="exClass" data-val="all">সব শ্রেণি</button>${classes.map(c => `<button class="${fc == c ? 'on' : ''}" data-act="filter" data-key="exClass" data-val="${c}">${U.cls(c)}</button>`).join('')}</div>` : ''}
      <div class="card"><div class="list">
      ${list.length ? list.map(e => { const a = avgOf(e); return `<button class="item" data-act="exam-open" data-id="${e.id}">
        <div class="grow"><div class="row wrap" style="gap:6px">${typeChip(e.type)}<span class="d">${U.cls(e.class)} · ${U.dateLabel(e.exam_date)}</span></div>
          <div class="t ellip" style="margin-top:3px">${esc(e.title)}</div><div class="d">${esc(e.subject)} · পূর্ণমান ${U.marks(e.full_marks)}</div></div>
        <div class="end">${e.published ? `<div class="score">${U.pct(a)}</div><div class="d">ক্লাসের গড়</div>` : results.some(x => x.exam_id === e.id) ? '<span class="chip wait">প্রকাশ বাকি</span>' : '<span class="chip due">নম্বর বাকি</span>'}</div></button>`; }).join('')
      : empty('exam', 'কোনো পরীক্ষা নেই', 'নিচের + বোতাম চেপে নতুন পরীক্ষা যোগ করুন')}
      </div></div>
      <button class="fab" data-act="exam-form" aria-label="নতুন পরীক্ষা">${icon('plus')}</button>`;
  };

  function examForm(e) {
    const isNew = !e;
    e = e || { type: 'weekly', class: 5, subject: 'গণিত', chapter: '', full_marks: 20, exam_date: U.today() };
    let type = e.type;
    const defFull = { weekly: 20, monthly: 50, model: 100 };
    openSheet(`<h3>${isNew ? 'নতুন পরীক্ষা' : 'পরীক্ষার তথ্য বদলান'}</h3>
      <form id="ef" class="stack" novalidate>
        <div class="field"><label>পরীক্ষার ধরন</label><div class="seg" id="ef-type">${Object.entries(U.EXAM_TYPES).map(([k, l]) => `<button type="button" data-t="${k}" class="${type === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
        <div class="grid2">
          <div class="field"><label for="ef-class">শ্রেণি</label><select id="ef-class">${U.CLASS_OPTIONS.map(c => `<option value="${c}" ${e.class == c ? 'selected' : ''}>${U.cls(c)}</option>`).join('')}</select></div>
          <div class="field"><label for="ef-date">তারিখ</label><input id="ef-date" type="date" value="${e.exam_date}"></div>
        </div>
        <div class="grid2">
          <div class="field"><label for="ef-sub">বিষয়</label><input id="ef-sub" list="ef-subs" value="${esc(e.subject)}"><datalist id="ef-subs">${U.SUBJECTS.concat(['সব বিষয়']).map(s => `<option value="${s}">`).join('')}</datalist></div>
          <div class="field"><label for="ef-full">পূর্ণমান</label><input id="ef-full" inputmode="decimal" value="${bn(e.full_marks)}"></div>
        </div>
        <div class="field"><label for="ef-ch">অধ্যায় / বিষয়বস্তু</label><input id="ef-ch" placeholder="যেমন: ভগ্নাংশ" value="${esc(e.chapter || '')}"><span class="hint">অধ্যায় লিখলে কোন অধ্যায়ে দুর্বলতা আছে, অ্যাপ তা দেখাতে পারবে</span></div>
        ${isNew ? `<div class="field"><label for="ef-cost">প্রশ্ন ছাপার খরচ (ঐচ্ছিক)</label><input id="ef-cost" inputmode="numeric" placeholder="মোট খরচ"><span class="hint">লিখলে খরচের খাতায় উঠে যাবে</span></div>` : ''}
        <div id="ef-err"></div>
        <div class="acts"><button type="button" class="btn line" data-act="close">বাতিল</button><button class="btn" type="submit">${isNew ? 'তৈরি করে নম্বর তুলুন' : 'সংরক্ষণ'}</button></div>
      </form>`, sh => {
      const f = sh.querySelector('#ef');
      sh.querySelectorAll('#ef-type button').forEach(b => b.onclick = () => {
        type = b.dataset.t; sh.querySelectorAll('#ef-type button').forEach(x => x.classList.toggle('on', x === b));
        if (isNew) f.querySelector('#ef-full').value = bn(defFull[type]);
        if (isNew && type === 'model') { f.querySelector('#ef-sub').value = 'সব বিষয়'; }
      });
      f.addEventListener('submit', async ev => {
        ev.preventDefault();
        const v = id => f.querySelector(id).value.trim();
        const full = parseFloat(U.en(v('#ef-full')));
        if (!v('#ef-sub')) return f.querySelector('#ef-err').innerHTML = '<div class="err">বিষয় লিখুন</div>';
        if (!(full > 0)) return f.querySelector('#ef-err').innerHTML = '<div class="err">পূর্ণমান ঠিক নেই</div>';
        const ch = v('#ef-ch');
        const title = type === 'model' ? (ch || 'মডেল টেস্ট') : U.EXAM_TYPES[type] + ' পরীক্ষা: ' + (ch || v('#ef-sub'));
        const row = { id: e.id, title, type, class: +v('#ef-class'), subject: v('#ef-sub'), chapter: ch, full_marks: full, exam_date: v('#ef-date') || U.today() };
        const saved = await busy(f.querySelector('button[type=submit]'), async () => {
          const r = await S.store.saveExam(row);
          const cost = isNew ? +U.en(f.querySelector('#ef-cost').value).replace(/\D/g, '') : 0;
          if (cost) await S.store.saveExpense({ title: title + ' · প্রশ্ন ছাপা', category: 'exam', class: row.class, amount: cost, spent_on: row.exam_date });
          return r;
        });
        closeSheet();
        if (isNew) { U.toast('পরীক্ষা তৈরি হয়েছে, এবার নম্বর তুলুন'); go('exam', { id: saved.id }); }
        else { U.toast('সংরক্ষণ হয়েছে'); render(); }
      });
    });
  }

  // নম্বর তোলা
  VIEWS.exam = async ({ id }) => {
    const [exams, students, results, rimgs] = await Promise.all([S.store.exams(), S.store.students(), S.store.examResults(id), S.store.resultImages(id)]);
    const imgCount = sid => ((rimgs.find(x => x.student_id === sid) || {}).images || []).length;
    const e = exams.find(x => x.id === id);
    if (!e) return empty('exam', 'পরীক্ষাটি পাওয়া যায়নি');
    const roster = students.filter(s => s.class === e.class && (s.active || results.some(r => r.student_id === s.id)));
    S.cache = { exam: e, roster, results };
    return `
      ${pageHead(esc(e.title), `${U.cls(e.class)} · ${esc(e.subject)} · ${U.dateLabel(e.exam_date)}`, '', true)}
      <div class="row wrap" style="gap:8px">${typeChip(e.type)}<span class="chip grey">পূর্ণমান ${U.marks(e.full_marks)}</span>${e.published ? '<span class="chip ok">প্রকাশিত</span>' : '<span class="chip wait">প্রকাশ হয়নি</span>'}
        <span class="grow"></span><button class="btn line sm" data-act="exam-edit">${icon('edit')}বদলান</button><button class="btn danger sm" data-act="exam-delete" aria-label="পরীক্ষা মুছুন">${icon('trash')}</button></div>
      <div class="tiles four" id="ex-stats"></div>
      <div class="card">
        <div class="sec-h" style="margin-bottom:4px"><h2>নম্বর লিখুন</h2><span class="sub">অনুপস্থিত হলে "নেই", খাতার ছবি দিতে ${icon('file').replace('<svg', '<svg style="width:14px;height:14px;vertical-align:-2px"')} চাপুন</span></div>
        ${roster.length ? roster.map(s => { const r = results.find(x => x.student_id === s.id) || {}; return `
          <div class="mark-row ${r.absent ? 'isabs' : ''}" data-sid="${s.id}">
            <div class="grow"><div class="t ellip"><b>${esc(s.name)}</b></div><div class="d small mut">${s.roll ? 'রোল ' + bn(s.roll) : ''}</div></div>
            <input inputmode="decimal" aria-label="${esc(s.name)} এর নম্বর" value="${r.marks != null ? bn(r.marks) : ''}" ${r.absent ? 'disabled' : ''}>
            <button type="button" class="abs ${r.absent ? 'on' : ''}" data-act="toggle-abs" aria-pressed="${!!r.absent}">নেই</button>
            <button type="button" class="scr ${imgCount(s.id) ? 'has' : ''}" data-act="script-open" data-id="${s.id}" aria-label="${esc(s.name)} এর খাতার ছবি">${icon('file')}<span class="n">${imgCount(s.id) ? bn(imgCount(s.id)) : ''}</span></button>
          </div>`; }).join('') : empty('users', 'এই শ্রেণিতে কোনো ছাত্র নেই', 'আগে ছাত্র যোগ করুন')}
      </div>
      ${roster.length ? `<div class="grid2" style="position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:5">
        <button class="btn line" style="background:var(--card)" data-act="marks-save">সংরক্ষণ</button>
        ${e.published ? `<button class="btn ghost" style="background:var(--card)" data-act="marks-unpublish">প্রকাশ বন্ধ করুন</button>` : `<button class="btn gold" data-act="marks-publish">${icon('send')}প্রকাশ করুন</button>`}
      </div>
      <p class="small mut" style="margin:0">প্রকাশ করলে প্রত্যেক গার্ডিয়ানের অ্যাপে নম্বর, ক্লাসে অবস্থান আর গ্রাফ চলে যাবে।</p>` : ''}`;
  };
  VIEWS.exam.after = () => {
    mainEl.querySelectorAll('.mark-row input').forEach(i => i.addEventListener('input', () => { validateMarks(); }));
    validateMarks();
  };
  function readMarks() {
    const e = S.cache.exam, rows = [], bad = [];
    mainEl.querySelectorAll('.mark-row').forEach(row => {
      const inp = row.querySelector('input'), absent = row.classList.contains('isabs');
      const raw = U.en(inp.value).trim();
      if (absent) rows.push({ student_id: row.dataset.sid, marks: null, absent: true });
      else if (raw !== '') {
        const m = parseFloat(raw);
        if (isNaN(m) || m < 0 || m > e.full_marks) bad.push(inp);
        else rows.push({ student_id: row.dataset.sid, marks: m, absent: false });
      }
      inp.classList.toggle('bad', !absent && raw !== '' && (isNaN(parseFloat(raw)) || parseFloat(raw) < 0 || parseFloat(raw) > e.full_marks));
    });
    return { rows, bad };
  }
  function validateMarks() {
    const { rows, bad } = readMarks();
    const e = S.cache.exam, total = S.cache.roster.length;
    const present = rows.filter(r => !r.absent);
    const avg = present.length ? present.reduce((t, r) => t + r.marks, 0) / present.length : null;
    const top = present.length ? Math.max(...present.map(r => r.marks)) : null;
    const el = document.getElementById('ex-stats');
    if (el) el.innerHTML = `
      <div class="tile"><div class="k">নম্বর তোলা</div><div class="v">${bn(rows.length)} <small>/ ${bn(total)}</small></div></div>
      <div class="tile"><div class="k">গড়</div><div class="v">${avg == null ? '–' : U.marks(Math.round(avg * 10) / 10)}</div><div class="s">${avg == null ? '' : U.pct(avg * 100 / e.full_marks)}</div></div>
      <div class="tile"><div class="k">সর্বোচ্চ</div><div class="v">${top == null ? '–' : U.marks(top)}</div></div>
      <div class="tile"><div class="k">ভুল ঘর</div><div class="v ${bad.length ? 'down' : ''}">${bn(bad.length)}</div><div class="s">${bad.length ? 'পূর্ণমানের বেশি' : 'সব ঠিক আছে'}</div></div>`;
  }
  async function saveMarks(btn) {
    const { rows, bad } = readMarks();
    if (bad.length) { bad[0].focus(); U.toast('লাল ঘরের নম্বর ঠিক করুন'); throw new Error('bad'); }
    await busy(btn, () => S.store.saveResults(S.cache.exam.id, rows));
    return rows;
  }
  async function publishExam(btn) {
    const rows = await saveMarks(btn);
    if (!rows.length) { U.toast('আগে নম্বর লিখুন'); return; }
    const e = S.cache.exam;
    const missing = S.cache.roster.length - rows.length;
    if (missing > 0 && !(await confirmSheet('সবার নম্বর তোলা হয়নি', `${bn(missing)} জনের নম্বর বা অনুপস্থিতি লেখা হয়নি। তবুও প্রকাশ করবেন?`, 'প্রকাশ করুন'))) return;
    await busy(btn, async () => {
      await S.store.setPublished(e.id, true);
      const present = rows.filter(r => !r.absent).map(r => r.marks).sort((a, b) => b - a);
      await S.store.notify(rows.map(r => ({
        student_id: r.student_id, kind: 'result', title: 'নতুন রেজাল্ট: ' + e.title,
        body: r.absent ? 'এই পরীক্ষায় অনুপস্থিত ছিল' : `পেয়েছে ${U.marks(r.marks)}/${U.marks(e.full_marks)} · ক্লাসে ${ordinal(present.indexOf(r.marks) + 1)}`
      })));
    });
    U.toast('রেজাল্ট প্রকাশ হয়েছে, গার্ডিয়ানরা দেখতে পাবেন'); render();
  }

  // ---------- শিক্ষক: বেতন ----------
  // একজন ছাত্রের কোন কোন মাস বাকি (ভর্তির মাস থেকে, সর্বোচ্চ ১২ মাস পেছনে)
  function monthsDue(s, allPays, upto) {
    const now = U.monthKey();
    let m = U.monthKey(new Date(s.created_at || Date.now()));
    const floor = U.monthShift(now, -11);
    if (m < floor) m = floor;
    const out = [];
    for (; m <= upto; m = U.monthShift(m, 1)) if (feeStatus(s, m, allPays).s === 'due') out.push(m);
    return out;
  }

  const feeModeSeg = mode => `<div class="seg"><button class="${mode === 'fee' ? 'on' : ''}" data-act="filter" data-key="feeMode" data-val="fee">মাসিক বেতন</button><button class="${mode === 'print' ? 'on' : ''}" data-act="filter" data-key="feeMode" data-val="print">ছাপার খরচ</button></div>`;
  const monthNav = mk => `<div class="month-nav"><button data-act="month" data-d="-1" aria-label="আগের মাস">${icon('left')}</button><b>${U.monthLabel(mk)}</b><button data-act="month" data-d="1" aria-label="পরের মাস" ${mk >= U.monthKey() ? 'disabled' : ''}>${icon('right')}</button></div>`;

  VIEWS.fees = async () => {
    if ((S.f.feeMode || 'fee') === 'print') return printView();
    const mk = S.f.feeMonth || U.monthKey();
    const [students, allPays] = await Promise.all([S.store.students(), S.store.payments()]);
    const pays = allPays.filter(p => p.month === mk);
    const active = students.filter(s => s.active);
    S.cache = { students, pays, allPays, month: mk };
    const now = U.monthKey();
    const rows = active.map(s => ({ s, st: feeStatus(s, mk, pays), dues: monthsDue(s, allPays, now) }));
    const ff = S.f.feeF || 'all';
    const shown = rows.filter(r => ff === 'all' || (ff === 'due' ? r.st.s !== 'paid' : r.st.s === 'paid'));
    const collected = rows.filter(r => r.st.s === 'paid').reduce((t, r) => t + r.st.p.amount, 0);
    const expected = active.reduce((t, s) => t + (s.monthly_fee || 0), 0);
    const pending = pays.filter(p => p.status === 'pending');
    const nPaid = rows.filter(r => r.st.s === 'paid').length;
    const isFuture = mk > now;
    const totalDueAmt = rows.reduce((t, r) => t + r.dues.length * (r.s.monthly_fee || 0), 0);
    const multi = rows.filter(r => r.dues.length > 1).length;
    return `
      ${pageHead('টাকার হিসাব', 'হাতে নগদ, বিকাশ, নগদ আর রকেট')}
      ${feeModeSeg('fee')}
      ${monthNav(mk)}
      <div class="tiles">
        <div class="tile"><div class="k">এ মাসে আদায়</div><div class="v">${U.money(collected)}</div><div class="s">মোট ${U.money(expected)} এর মধ্যে</div></div>
        <div class="tile"><div class="k">দিয়েছে</div><div class="v">${bn(nPaid)} <small>/ ${bn(active.length)} জন</small></div><div class="progress" style="margin-top:6px"><i style="width:${active.length ? nPaid * 100 / active.length : 0}%"></i></div></div>
      </div>
      ${totalDueAmt ? `<div class="card row" style="background:var(--rosel)"><div class="grow"><b style="color:var(--rose)">সব মিলিয়ে মোট বকেয়া ${U.money(totalDueAmt)}</b><div class="small">${multi ? bn(multi) + ' জনের একাধিক মাস বাকি' : 'আগের কোনো মাস বাকি নেই'}</div></div></div>` : ''}
      ${pending.length ? `<div class="card stack"><div class="sec-h"><h2>যাচাই বাকি (${bn(pending.length)})</h2></div><div class="list">${pending.map(p => pendingRow(p, (students.find(s => s.id === p.student_id) || {}).name)).join('')}</div></div>` : ''}
      <div class="filters">${[['all', 'সবাই'], ['due', 'যারা দেয়নি'], ['paid', 'যারা দিয়েছে']].map(([k, l]) => `<button class="${ff === k ? 'on' : ''}" data-act="filter" data-key="feeF" data-val="${k}">${l}</button>`).join('')}</div>
      <div class="card"><div class="list">
        ${shown.length ? shown.map(({ s, st, dues }) => {
          const other = dues.filter(m => m !== mk);
          return `<div class="item" style="cursor:default">
          <button class="row grow" data-act="fee-open" data-id="${s.id}" style="border:0;background:none;padding:0;text-align:left;cursor:pointer;color:inherit">
            <div class="av">${esc(U.initial(s.name))}</div>
            <div class="grow"><div class="t ellip">${esc(s.name)}</div><div class="d">${U.cls(s.class)} · ${U.money(s.monthly_fee)}${st.p ? ' · ' + U.METHODS[st.p.method] : ''}</div>
              ${other.length ? `<div class="d" style="color:var(--rose);font-weight:700">${dues.length > 1 ? 'মোট বাকি ' + bn(dues.length) + ' মাস' : 'বাকি ' + U.monthLabel(other[0])}</div>` : ''}</div>
          </button>
          <div class="end">${st.s === 'due' || other.length ? `<button class="btn sm" data-act="${dues.length === 1 && st.s === 'due' ? 'cash-quick' : 'cash-form'}" data-id="${s.id}">${icon('check')}নগদ পেয়েছি</button>` : feeChip(st)}</div></div>`;
        }).join('') : empty('wallet', ff === 'due' ? 'সবাই বেতন দিয়েছে' : 'কেউ নেই')}
      </div></div>
      ${rows.some(r => r.st.s === 'due') ? `<button class="btn ghost block" data-act="remind-all">${icon('bell')}বকেয়া সবাইকে মনে করিয়ে দিন</button>` : ''}`;
  };


  // ---------- শিক্ষক: ছাপার খরচ ----------
  const CATS = { sheet: 'শিট ছাপা', exam: 'প্রশ্ন ছাপা', other: 'অন্যান্য' };
  const roundUp5 = v => Math.ceil(v / 5) * 5;
  function splitPlan(students, expenses) {
    const active = students.filter(s => s.active);
    const general = expenses.filter(e => e.class == null).reduce((t, e) => t + e.amount, 0);
    const classes = [...new Set(active.map(s => s.class))].sort((a, b) => a - b);
    return classes.map(c => {
      const n = active.filter(s => s.class === c).length;
      const own = expenses.filter(e => e.class === c).reduce((t, e) => t + e.amount, 0);
      const share = own / n + (active.length ? general / active.length : 0);
      return { c, n, own, gshare: active.length ? general * n / active.length : 0, total: own + (active.length ? general * n / active.length : 0), per: share > 0 ? roundUp5(share) : 0 };
    });
  }

  async function printView() {
    const mk = S.f.feeMonth || U.monthKey();
    const [students, expenses, charges] = await Promise.all([S.store.students(), S.store.expenses(mk), S.store.charges(mk)]);
    S.cache = { students, expenses, charges, month: mk };
    const spent = expenses.reduce((t, e) => t + e.amount, 0);
    const billed = charges.reduce((t, c) => t + c.amount, 0);
    const got = charges.filter(c => c.paid).reduce((t, c) => t + c.amount, 0);
    const plan = splitPlan(students, expenses);
    const sName = id => students.find(s => s.id === id) || { name: '' };
    const done = charges.length > 0;
    const crow = c => { const s = sName(c.student_id); return `<div class="item" style="cursor:default">
        <div class="av">${esc(U.initial(s.name))}</div>
        <div class="grow"><div class="t ellip">${esc(s.name)}</div><div class="d">${U.cls(s.class)} · <b class="num" style="color:var(--ink)">${U.money(c.amount)}</b></div></div>
        <div class="end">${c.paid ? `<button class="chip ok" style="border:0;cursor:pointer" data-act="charge-unpay" data-id="${c.id}">দিয়েছে</button>` : `<button class="btn sm" data-act="charge-pay" data-id="${c.id}">${icon('check')}পেয়েছি</button>`}</div></div>`; };
    const unpaid = charges.filter(c => !c.paid), paidC = charges.filter(c => c.paid);
    return `
      ${pageHead('টাকার হিসাব', 'শিট ও প্রশ্ন ছাপার খরচ, ছাত্রদের মধ্যে ভাগ')}
      ${feeModeSeg('print')}
      ${monthNav(mk)}
      <div class="tiles">
        <div class="tile"><div class="k">এ মাসে ছাপার খরচ</div><div class="v">${U.money(spent)}</div><div class="s">${bn(expenses.length)}টি খরচ</div></div>
        <div class="tile"><div class="k">ছাত্রদের থেকে আদায়</div><div class="v">${U.money(got)}</div><div class="s">${done ? U.money(billed) + ' এর মধ্যে' : 'এখনো ভাগ হয়নি'}</div></div>
      </div>
      <div class="card stack">

  function feeSheet(sid) {
    const { students, pays, allPays, month } = S.cache;
    const s = students.find(x => x.id === sid), st = feeStatus(s, month, pays);
    const dues = monthsDue(s, allPays, U.monthKey());
    if (st.s === 'due') return cashForm(s);
    const history = allPays.filter(p => p.student_id === s.id && p.status === 'approved').sort((a, b) => b.month.localeCompare(a.month)).slice(0, 6);
    let body = '';
    if (st.s === 'paid') body = receiptHtml(st.p, s);
    else body = `<div class="list">${pendingRow(st.p, s.name)}</div>`;
    body += dues.length ? `<div class="err" style="margin-top:12px">আরও বাকি: ${dues.map(U.monthLabel).join(', ')}</div>` : '';
    body += history.length ? `<div class="sec-h" style="margin-top:14px"><h2 style="font-size:15px">আগের বেতন</h2></div><div class="list">${history.map(p => `<div class="item" style="cursor:default;padding:8px 0"><div class="grow"><div class="t">${U.monthLabel(p.month)}</div><div class="d">${U.METHODS[p.method]} · ${U.dateLabel(p.verified_at || p.created_at)}</div></div><b class="num">${U.money(p.amount)}</b></div>`).join('')}</div>` : '';
    body += `<div class="acts">${st.s === 'paid' ? `<button class="btn danger" data-act="pay-delete" data-id="${st.p.id}">${icon('trash')}বাতিল</button>` : ''}${dues.length ? `<button class="btn" data-act="cash-form" data-id="${s.id}">${icon('check')}বাকি টাকা নিন</button>` : `<button class="btn line" data-act="close">বন্ধ</button>`}</div>`;
    openSheet(`<h3>${esc(s.name)}</h3><div class="small mut" style="margin:-8px 0 12px">${U.cls(s.class)} · ${U.monthLabel(month)}</div>${body}`);
  }

  // হাতে নগদ নেওয়া: এক বা একাধিক মাস একসাথে
  function cashForm(s) {
    const { allPays, month } = S.cache;
    const now = U.monthKey();
    const dues = monthsDue(s, allPays, now);
    const advance = [1, 2].map(n => U.monthShift(now, n)).filter(m => feeStatus(s, m, allPays).s === 'due');
    const options = dues.concat(advance);
    const sel = new Set([dues.includes(month) ? month : (dues[0] || advance[0])]);
    openSheet(`<h3>${esc(s.name)}</h3><div class="small mut" style="margin:-8px 0 12px">${U.cls(s.class)} · মাসিক ${U.money(s.monthly_fee)}</div>
      <div class="stack">
        <div class="field"><label>কোন কোন মাসের টাকা দিল? (একাধিক বাছা যায়)</label>
          <div class="filters" style="flex-wrap:wrap" id="cf-months">${options.map(m => `<button type="button" data-m="${m}">${U.monthLabel(m)}${m > now ? ' · অগ্রিম' : ''}</button>`).join('')}</div>
          ${dues.length > 1 ? `<span class="hint" style="color:var(--rose)">${bn(dues.length)} মাস বাকি আছে। সবচেয়ে পুরোনো মাস আগে বাছুন।</span>` : ''}</div>
        <div class="field"><label for="cf-amt">প্রতি মাসের টাকা</label><input id="cf-amt" inputmode="numeric" value="${bn(s.monthly_fee)}"></div>
        <div class="paybox"><div class="grow"><div class="small mut" id="cf-sum-l"></div><div class="no" id="cf-sum"></div></div></div>
        <div class="acts" style="margin-top:4px"><button class="btn ghost" data-act="remind" data-id="${s.id}">${icon('bell')}মনে করান</button><button class="btn" id="cf-go">${icon('check')}<span id="cf-go-l">নগদ পেয়েছি</span></button></div>
      </div>`, sh => {
      const amt = () => +U.en(sh.querySelector('#cf-amt').value).replace(/\D/g, '') || 0;
      const draw = () => {
        sh.querySelectorAll('#cf-months button').forEach(b => b.classList.toggle('on', sel.has(b.dataset.m)));
        const n = sel.size;
        sh.querySelector('#cf-sum-l').textContent = n ? [...sel].sort().map(U.monthLabel).join(' + ') : 'কোনো মাস বাছা হয়নি';
        sh.querySelector('#cf-sum').textContent = 'মোট ' + U.money(n * amt());
        sh.querySelector('#cf-go-l').textContent = n > 1 ? `${bn(n)} মাসের টাকা পেয়েছি` : 'নগদ পেয়েছি';
        sh.querySelector('#cf-go').disabled = !n || !amt();
      };
      sh.querySelectorAll('#cf-months button').forEach(b => b.onclick = () => { sel.has(b.dataset.m) ? sel.delete(b.dataset.m) : sel.add(b.dataset.m); draw(); });
      sh.querySelector('#cf-amt').addEventListener('input', draw);
      draw();
      sh.querySelector('#cf-go').onclick = async ev => {
        const months = [...sel].sort(), a = amt();
        const made = await busy(ev.currentTarget, async () => {
          const out = [];
          for (const m of months) out.push(await S.store.recordCash(s.id, m, a));
          await S.store.notify([{ student_id: s.id, kind: 'fee', title: 'বেতন পাওয়া গেছে', body: `${months.map(U.monthLabel).join(', ')} · মোট ${U.money(a * months.length)} · হাতে নগদ` }]);
          return out;
        });
        closeSheet(); await render();
        U.toast(`${s.name}: ${bn(months.length)} মাস, ${U.money(a * months.length)} জমা হয়েছে`, 'ভুল হয়েছে', async () => {
          for (const p of made) await S.store.deletePayment(p.id);
          U.toast('ফিরিয়ে নেওয়া হয়েছে'); render();
        });
      };
    });
  }

  function sheetForm() {
    openSheet(`<h3>শিট আপলোড</h3>
      <form id="shf" class="stack" novalidate>
        <div class="field"><label for="shf-file">ফাইল বাছুন (PDF বা ছবি)</label><input id="shf-file" type="file" accept="application/pdf,image/*,.doc,.docx"><span class="hint">সর্বোচ্চ ২০ MB</span></div>
        <div class="field"><label for="shf-title">শিটের নাম</label><input id="shf-title" placeholder="যেমন: ভগ্নাংশ · প্রশ্ন শিট"></div>
        <div class="grid2">
          <div class="field"><label for="shf-class">শ্রেণি</label><select id="shf-class"><option value="">সব শ্রেণি</option>${U.CLASS_OPTIONS.map(c => `<option value="${c}" ${c === 5 ? 'selected' : ''}>${U.cls(c)}</option>`).join('')}</select></div>

        <div id="shf-err"></div>
        <div class="acts"><button type="button" class="btn line" data-act="close">বাতিল</button><button class="btn" type="submit">${icon('upload')}আপলোড</button></div>

      const f = sh.querySelector('#shf');
      const fileIn = f.querySelector('#shf-file');
      fileIn.addEventListener('change', () => { const t = f.querySelector('#shf-title'); if (!t.value && fileIn.files[0]) t.value = fileIn.files[0].name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' '); });
      f.addEventListener('submit', async ev => {
        ev.preventDefault();

      });
    });
  }

  VIEWS.gfees = async () => {
    const list = await kids();
    if (!list.length) return noKids();
    const k = list.find(x => x.id === S.kid);
    const [allPays, allCharges] = await Promise.all([S.store.payments(), S.store.charges()]);
    const pays = allPays.filter(p => p.student_id === k.id);
    const charges = allCharges.filter(c => c.student_id === k.id).sort((a, b) => b.month.localeCompare(a.month)).slice(0, 6);
    S.cache = { pays, kid: k, charges };
    const mk = U.monthKey();
    const start = U.monthKey(new Date(k.created_at || Date.now()));
    const months = [];
    for (let i = 0; i < 6; i++) { const m = U.monthShift(mk, -i); if (m < start) break; months.push(m); }
    return `
      ${pageHead('বেতন', esc(k.name) + ' · মাসিক ' + U.money(k.monthly_fee))}
      ${kidSwitch(list)}
      ${(() => {
        let streak = 0, m = mk;
        if (!onTime(feeStatus(k, m, pays).p)) m = U.monthShift(m, -1);
        while (m >= start && onTime(feeStatus(k, m, pays).p)) { streak++; m = U.monthShift(m, -1); }
        return streak >= 3 ? `<div class="card row" style="background:var(--goldl)"><div class="av" style="background:var(--gold);color:#0b3b36">${icon('trophy')}</div><div class="grow"><b style="color:var(--goldt)">নিয়মিত পরিশোধকারী</b><div class="small">টানা ${bn(streak)} মাস ${bn(dueDay())} তারিখের মধ্যে বেতন দিয়েছেন। ধন্যবাদ!</div></div></div>` : '';

        const st = feeStatus(k, m, pays);

      }).join('')}</div></div>
      ${charges.length ? `<div class="card"><div class="sec-h"><h2>শিট ও প্রশ্ন ছাপার খরচ</h2></div><div class="list">${charges.map(c => `<button class="item" data-act="print-detail" data-month="${c.month}">
        <div class="grow"><div class="t">${U.monthLabel(c.month)}</div><div class="d">জনপ্রতি ভাগ · বিস্তারিত দেখুন</div></div>

        <p class="small mut" style="margin:6px 0 0">ছাপার টাকা শিক্ষককে হাতে দিন।</p></div>` : ''}
      <p class="small mut" style="margin:0">শিক্ষককে হাতে টাকা দিলে তিনি অ্যাপে তুলে দেবেন, আর আপনি সাথে সাথে রসিদ পাবেন। চাইলে বিকাশ, নগদ বা রকেটে পাঠিয়ে ট্রানজেকশন আইডিও জমা দিতে পারেন।</p>`;

    const nums = { bkash: S.settings.bkash, nagad: S.settings.nagad, rocket: S.settings.rocket };
    const avail = Object.keys(nums).filter(m => nums[m]);
    if (!avail.length) { U.toast('শিক্ষক এখনো পেমেন্ট নম্বর দেননি'); return; }
    let method = avail[0];
    const draw = sh => {
      sh.querySelectorAll('.pay-methods button').forEach(b => b.classList.toggle('on', b.dataset.m === method));
      sh.querySelector('#pay-no').textContent = bn(nums[method]);
      sh.querySelector('#pay-app').textContent = U.METHODS[method];
    };
    openSheet(`<h3>বেতন দিন</h3>
      <div class="small mut" style="margin:-8px 0 12px">${esc(k ? k.name : '')} · ${U.monthLabel(month)} · <b class="num" style="color:var(--ink)">${U.money(k.monthly_fee)}</b></div>
      <div class="stack">
        <div class="pay-methods">${['bkash', 'nagad', 'rocket'].map(m => `<button type="button" data-m="${m}" ${nums[m] ? '' : 'disabled style="opacity:.4"'}><span class="mk ${m}">${U.METHODS[m].slice(0, 1)}</span>${U.METHODS[m]}</button>`).join('')}</div>
        <div class="paybox"><div class="grow"><div class="small mut"><span id="pay-app"></span> নম্বর (Send Money)</div><div class="no" id="pay-no"></div></div><button class="btn ghost sm" data-act="copy-pay">${icon('copy')}কপি</button></div>
        <ol class="small" style="margin:0;padding-left:20px;color:var(--mut)"><li>আপনার অ্যাপ থেকে উপরের নম্বরে <b>${U.money(k.monthly_fee)}</b> Send Money করুন</li><li>মেসেজে পাওয়া ট্রানজেকশন আইডি নিচে লিখুন</li></ol>
        <div class="field"><label for="pay-trx">ট্রানজেকশন আইডি (TrxID)</label><input id="pay-trx" autocapitalize="characters" autocomplete="off" placeholder="যেমন: 9JK7Q2M4AF" style="text-transform:uppercase;letter-spacing:1px"></div>
        <div id="pay-err"></div>
        <div class="acts" style="margin-top:4px"><button class="btn line" data-act="close">বাতিল</button><button class="btn" id="pay-go">${icon('send')}জমা দিন</button></div>
      </div>`, sh => {
      draw(sh);
      sh.querySelectorAll('.pay-methods button').forEach(b => b.onclick = () => { if (nums[b.dataset.m]) { method = b.dataset.m; draw(sh); } });
      sh.querySelector('[data-act=copy-pay]').onclick = ev => { ev.stopPropagation(); U.copy(nums[method], sh.querySelector('#pay-no')); };
      sh.querySelector('#pay-go').onclick = async ev => {
        const trx = U.en(sh.querySelector('#pay-trx').value).replace(/\s/g, '').toUpperCase();
        if (!/^[A-Z0-9]{6,30}$/.test(trx)) { sh.querySelector('#pay-err').innerHTML = '<div class="err">ট্রানজেকশন আইডিটা ঠিক নেই। মেসেজ থেকে হুবহু লিখুন।</div>'; return; }
        await busy(ev.currentTarget, () => S.store.submitPayment({ student_id: sid, month, amount: k.monthly_fee, method, trx_id: trx }));
        closeSheet(); U.toast('জমা হয়েছে। শিক্ষক যাচাই করলে রসিদ পাবেন।'); render();
      };
    });
  }

  // ================= অনলাইন টেস্ট ও হোমওয়ার্ক =================
  const QTYPES = { mcq: 'MCQ', num: 'গণিতের উত্তর', written: 'লিখিত (খাতার ছবি)' };
  const OPT = ['ক', 'খ', 'গ', 'ঘ'];
  const dueLabel = iso => {
    if (!iso) return 'সময়সীমা নেই';
    const ms = new Date(iso.length <= 10 ? iso + 'T23:59:59' : iso) - Date.now();
    if (ms < 0) return 'সময় শেষ';
    const d = Math.floor(ms / 864e5), h = Math.floor(ms / 3600e3);
    return d >= 1 ? `আর ${bn(d)} দিন` : h >= 1 ? `আর ${bn(h)} ঘণ্টা` : 'আজই শেষ';
  };
  const isPast = iso => iso && new Date(iso.length <= 10 ? iso + 'T23:59:59' : iso) < new Date();
  const dtLocal = iso => { const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
  const dateTimeLabel = iso => { const d = new Date(iso); return U.dateLabel(iso) + ', ' + bn(((d.getHours() + 11) % 12) + 1) + ':' + bn(String(d.getMinutes()).padStart(2, '0')) + (d.getHours() < 12 ? ' AM' : ' PM'); };

  };

      const q = S.draft.questions[+card.dataset.i];
      card.querySelectorAll('[data-f]').forEach(inp => inp.addEventListener('input', () => { q[inp.dataset.f] = inp.dataset.f === 'marks' ? U.en(inp.value) : inp.value; }));
      card.querySelectorAll('[data-o]').forEach(inp => inp.addEventListener('input', () => { q.options[+inp.dataset.o] = inp.value; }));
    });
    const m = id => document.getElementById(id);
    const sync = () => Object.assign(S.draft, { class: +m('t-class').value, subject: m('t-sub').value.trim(), chapter: m('t-ch').value.trim(), duration_min: +U.en(m('t-dur').value) || 20, due_at: m('t-due').value ? new Date(m('t-due').value).toISOString() : null });
    m('t-meta').addEventListener('input', sync); m('t-meta').addEventListener('change', sync);
  };

  async function saveDraftTest(btn) {
    const t = S.draft;
    if (!t.subject) throw new Error('বিষয় লিখুন');
    if (!t.questions.length) throw new Error('অন্তত একটা প্রশ্ন যোগ করুন');
    for (const [i, q] of t.questions.entries()) {
      if (!String(q.text).trim()) throw new Error(`প্রশ্ন ${bn(i + 1)} এর লেখা খালি`);
      if (!(+q.marks > 0)) throw new Error(`প্রশ্ন ${bn(i + 1)} এর নম্বর ঠিক নেই`);
      if (q.type === 'mcq' && (q.ans === '' || q.options.some(o => !String(o).trim()))) throw new Error(`প্রশ্ন ${bn(i + 1)}: চারটা অপশন লিখে সঠিকটা বাছুন`);
      if (q.type === 'num' && !String(q.ans).trim()) throw new Error(`প্রশ্ন ${bn(i + 1)} এর সঠিক উত্তর লিখুন`);
    }
    const key = {}, questions = t.questions.map((q, i) => {
      const id = q.id || 'q' + Date.now().toString(36) + i;
      if (q.type !== 'written') key[id] = String(q.ans).trim();
      const out = { id, type: q.type, text: String(q.text).trim(), marks: +q.marks };
      if (q.type === 'mcq') out.options = q.options.map(o => String(o).trim());
      return out;
    });
    const row = { id: t.id, title: t.subject + ': ' + (t.chapter || 'প্র্যাকটিস টেস্ট'), class: t.class, subject: t.subject, chapter: t.chapter, duration_min: t.duration_min, due_at: t.due_at, questions };
    return busy(btn, () => S.store.saveTest(row, key));
  }

    const all = await S.store.attempts();

    S.cache = { attempt: a, test: t, student: s };

      const given = a.answers[q.id];
      if (q.type === 'written') return `<div class="card stack">
        <div class="row"><span class="chip model">প্রশ্ন ${bn(i + 1)} · লিখিত</span><span class="grow"></span><span class="small mut">পূর্ণমান ${U.marks(q.marks)}</span></div>

      return `<div class="card stack" style="border-left:4px solid ${ok2 ? 'var(--ok)' : 'var(--rose)'}">
        <div class="row"><span class="chip ${q.type === 'mcq' ? 'weekly' : 'monthly'}">প্রশ্ন ${bn(i + 1)}</span><span class="grow"></span><b class="${ok2 ? 'up' : 'down'}">${ok2 ? '✓ ' + U.marks(q.marks) : '✗ ০'}</b></div>

        <div class="small">দিয়েছে: <b>${show(given)}</b>${ok2 ? '' : ` · সঠিক: <b class="up">${show(key[q.id])}</b>`}</div></div>`;
    }));
    const hasW = t.questions.some(q => q.type === 'written');

      ${pageHead(esc(s ? s.name : ''), esc(t.title), '', true)}
      <div class="tiles"><div class="tile"><div class="k">নিজে থেকে পাওয়া</div><div class="v">${U.marks(a.auto_score)}</div><div class="s">MCQ ও গণিতের উত্তর</div></div>
        <div class="tile"><div class="k">মোট</div><div class="v" id="g-total">${U.marks(a.total)} <small>/ ${U.marks(t.total_marks)}</small></div></div></div>

        ${!x || x.status !== 'checked' ? `<button class="btn sm ${x ? 'line' : ''}" data-act="hw-submit" data-id="${h.id}">${x ? 'বদলাও' : icon('upload') + 'জমা দাও'}</button>` : ''}</div>`; }).join('') : empty('edit', 'কোনো হোমওয়ার্ক নেই')}</div></div>`;

  function hwSubmitSheet(hid) {

    const files = [];

      <div class="stack">

        <div class="field"><label for="hw-note">শিক্ষককে কিছু বলবে? (ঐচ্ছিক)</label><input id="hw-note" value="${esc(prev && prev.note || '')}"></div>
        ${prev ? '<span class="small mut">নতুন করে জমা দিলে আগের ছবিগুলোর জায়গায় এগুলো যাবে।</span>' : ''}
        <div class="acts"><button class="btn line" data-act="close">বাতিল</button><button class="btn" id="hw-go" disabled>${icon('send')}জমা দাও</button></div>

        sh.querySelector('#hw-thumbs').innerHTML = files.map((f, i) => `<div class="thumb"><img src="${f.url}" alt="ছবি ${bn(i + 1)}"><button type="button" class="x" data-i="${i}" aria-label="সরাও">×</button></div>`).join('');

  // ---------- ছাত্র: টেস্ট দেওয়া ----------
  let timerId = null;
  VIEWS.take = async ({ id }) => {
    clearInterval(timerId);

    const t = (await S.store.tests()).find(x => x.id === id);
    const a = await S.store.startTest(id, k.id);
    if (a.submitted_at) { setTimeout(() => go('testResult', { id }), 0); return ''; }
    const dkey = 'ac-take-' + a.id;
    if (!S.take || S.take.aid !== a.id) S.take = { aid: a.id, tid: id, sid: k.id, ans: U.ls.get(dkey, {}), imgs: {}, endsAt: new Date(a.started_at).getTime() + t.duration_min * 60e3, t };
    const T = S.take;
    return `
      <div class="timerbar" id="timerbar"><span>${icon('clock')}</span><b id="timer" class="num">–</b><span class="grow small" style="opacity:.85">${esc(t.title)}</span><button class="btn gold sm" data-act="take-submit">জমা দাও</button></div>

          : q.type === 'num' ? `<div class="field"><label for="ans-${q.id}">তোমার উত্তর</label><input id="ans-${q.id}" class="take-num" data-q="${q.id}" inputmode="text" autocomplete="off" value="${esc(T.ans[q.id] || '')}" placeholder="যেমন: ৭৫ বা ৫/৪"></div>`
          : `<label class="btn ghost block" for="file-${q.id}">${icon('upload')}খাতার ছবি যোগ করো</label><input id="file-${q.id}" class="take-file" data-q="${q.id}" type="file" accept="image/*" multiple hidden><div class="thumbs" id="th-${q.id}"></div>`}

    const T = S.take; if (!T) return;
    const dkey = 'ac-take-' + T.aid;
    mainEl.querySelectorAll('.take-num').forEach(i => i.addEventListener('input', () => { T.ans[i.dataset.q] = i.value; U.ls.set(dkey, T.ans); }));
    const drawThumbs = qid => {
      const el = document.getElementById('th-' + qid); if (!el) return;
      el.innerHTML = (T.imgs[qid] || []).map((f, i) => `<div class="thumb"><img src="${f.url}" alt="ছবি ${bn(i + 1)}"><button type="button" class="x" data-q="${qid}" data-i="${i}" aria-label="সরাও">×</button></div>`).join('');
      el.querySelectorAll('.x').forEach(b => b.onclick = () => { T.imgs[qid].splice(+b.dataset.i, 1); drawThumbs(qid); });
    };
    mainEl.querySelectorAll('.take-file').forEach(inp => inp.addEventListener('change', async () => {
      const q = inp.dataset.q; T.imgs[q] = T.imgs[q] || [];

    const tick2 = () => {
      const el = document.getElementById('timer');
      if (!el || S.view !== 'take') { clearInterval(timerId); return; }
      const left = Math.max(0, T.endsAt - Date.now()), m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
      el.textContent = bn(m) + ':' + bn(String(s).padStart(2, '0'));
      document.getElementById('timerbar').classList.toggle('low', left < 120000);
      if (left <= 0) { clearInterval(timerId); submitTake(null, true); }
    };
    clearInterval(timerId); tick2(); timerId = setInterval(tick2, 1000);
  };
  async function submitTake(btn, auto) {
    const T = S.take; if (!T || T.busy) return;
    if (!auto) {
      const left = T.t.questions.filter(q => q.type === 'written' ? !(T.imgs[q.id] || []).length : (T.ans[q.id] == null || T.ans[q.id] === '')).length;
      if (!(await confirmSheet('উত্তর জমা দেবে?', left ? `${bn(left)}টা প্রশ্নের উত্তর দেওয়া হয়নি। জমা দিলে আর বদলানো যাবে না।` : 'জমা দিলে আর বদলানো যাবে না।', 'জমা দাও'))) return;
    }
    T.busy = true; clearInterval(timerId);
    const run = async () => {
      const imgs = {};
      for (const [q, list] of Object.entries(T.imgs)) { imgs[q] = []; for (const f of list) imgs[q].push(await S.store.uploadImage(T.sid, f.blob)); }
      await S.store.submitTest(T.tid, T.sid, T.ans, imgs);
    };
    try { btn ? await busy(btn, run) : await run(); }
    catch (e) { T.busy = false; U.toast('জমা হয়নি: ' + e.message + ' আবার চেষ্টা করো।'); return; }
    U.ls.del('ac-take-' + T.aid);
    S.take = null;
    U.toast(auto ? 'সময় শেষ, উত্তর জমা হয়ে গেছে' : 'উত্তর জমা হয়েছে');
    S.history.pop(); S.view = 'testResult'; S.params = { id: T.tid }; render();
  }

  VIEWS.testResult = async ({ id }) => {

  // ================= প্রশ্নব্যাংক =================

            <div class="qtext">${esc(x.text)}</div>

          </button></div>`).join('') : empty('search', all.length ? 'এই বাছাইয়ে কোনো প্রশ্ন নেই' : 'প্রশ্নব্যাংক খালি', all.length ? '' : 'নিচের + বোতাম চেপে প্রথম প্রশ্ন যোগ করুন। অনলাইন টেস্টে যে প্রশ্ন লিখবেন, সেগুলোও এখানে জমা হবে।')}</div></div>

  VIEWS.bank.after = () => {

          <div class="field"><label for="qf-class">শ্রেণি</label><select id="qf-class">${U.CLASS_OPTIONS.map(c => `<option value="${c}" ${q.class == c ? 'selected' : ''}>${U.cls(c)}</option>`).join('')}</select></div>
          <div class="field"><label for="qf-sub">বিষয়</label><input id="qf-sub" list="qf-subs" value="${esc(q.subject)}"><datalist id="qf-subs">${U.SUBJECTS.map(s => `<option value="${s}">`).join('')}</datalist></div>
        </div>
        <div class="field"><label for="qf-ch">অধ্যায়</label><input id="qf-ch" list="qf-chs" value="${esc(q.chapter || '')}" placeholder="যেমন: শতকরা"><datalist id="qf-chs">${chs.map(s => `<option value="${esc(s)}">`).join('')}</datalist></div>
        <div class="field"><label>প্রশ্নের ধরন</label><div class="seg" id="qf-type" style="grid-auto-flow:row;grid-template-columns:repeat(4,1fr)">${Object.entries(BTYPES).map(([k, l]) => `<button type="button" data-t="${k}" class="${type === k ? 'on' : ''}">${l.replace('গণিতের উত্তর', 'গণিত')}</button>`).join('')}</div></div>
        <div class="field"><label for="qf-text">প্রশ্ন</label><textarea id="qf-text" rows="3">${esc(q.text)}</textarea></div>
        <div id="qf-ans"></div>
        <div class="grid2">
          <div class="field"><label for="qf-marks">নম্বর</label><input id="qf-marks" inputmode="decimal" value="${q.marks !== '' ? bn(q.marks) : bn(defMarks[type])}"></div>
          <div class="field"><label for="qf-src">উৎস</label><input id="qf-src" list="qf-srcs" value="${esc(q.source || '')}"><datalist id="qf-srcs">${SOURCES.map(s => `<option value="${s}">`).join('')}</datalist></div>
        </div>
        <div class="field"><label>কঠিনতা</label><div class="seg" id="qf-diff">${Object.entries(DIFF).map(([k, [l]]) => `<button type="button" data-d="${k}" class="${diff === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
        <div class="acts" style="flex-wrap:wrap">
          ${isNew ? `<button type="submit" class="btn line" data-more="1">সংরক্ষণ ও আরেকটা</button>` : `<button type="button" class="btn danger" id="qf-del">${icon('trash')}মুছুন</button>`}
          <button class="btn" type="submit">সংরক্ষণ</button></div>
      </form>`, sh => {
      const f2 = sh.querySelector('#qf');
      const drawAns = () => {
        const box = sh.querySelector('#qf-ans');
        if (type === 'mcq') {
          const opts = q.options && q.options.length === 4 ? q.options : ['', '', '', ''];
          box.innerHTML = `<div class="stack" style="gap:6px"><label class="small" style="font-weight:700;color:var(--mut)">অপশন (সঠিকটার অক্ষরে চাপুন)</label>${opts.map((o, j) => `<div class="row" style="gap:8px"><button type="button" class="optpick ${String(correct) === String(j) ? 'on' : ''}" data-j="${j}" aria-label="সঠিক ${OPT[j]}">${OPT[j]}</button><input class="grow optin" data-o="${j}" value="${esc(o)}" aria-label="অপশন ${OPT[j]}"></div>`).join('')}</div>`;
          box.querySelectorAll('.optpick').forEach(b => b.onclick = () => { correct = b.dataset.j; box.querySelectorAll('.optpick').forEach(x => x.classList.toggle('on', x === b)); });
          box.querySelectorAll('.optin').forEach(inp => inp.oninput = () => { q.options = q.options && q.options.length === 4 ? q.options : ['', '', '', '']; q.options[+inp.dataset.o] = inp.value; });
        } else {
          box.innerHTML = `<div class="field"><label for="qf-answer">${type === 'num' ? 'সঠিক উত্তর' : 'উত্তর / সমাধানের মূল কথা (ঐচ্ছিক)'}</label>${type === 'num' ? `<input id="qf-answer" value="${esc(type === q.type ? q.answer || '' : '')}" placeholder="যেমন: 75 বা 5/4">` : `<textarea id="qf-answer" rows="2">${esc(type === q.type ? q.answer || '' : '')}</textarea>`}<span class="hint">${type === 'num' ? 'অনলাইন টেস্টে নিজে থেকে নম্বর দিতে লাগবে' : 'প্রশ্নপত্রের উত্তরমালায় দেখাবে'}</span></div>`;
        }
      };
      drawAns();
      sh.querySelectorAll('#qf-type button').forEach(b => b.onclick = () => {
        type = b.dataset.t; sh.querySelectorAll('#qf-type button').forEach(x => x.classList.toggle('on', x === b));
        sh.querySelector('#qf-marks').value = bn(defMarks[type]); drawAns();
      });
      sh.querySelectorAll('#qf-diff button').forEach(b => b.onclick = () => { diff = b.dataset.d; sh.querySelectorAll('#qf-diff button').forEach(x => x.classList.toggle('on', x === b)); });
      if (!isNew) sh.querySelector('#qf-del').onclick = async () => {
        if (!(await confirmSheet('প্রশ্নটা মুছবেন?', 'আগে বানানো টেস্টে এর কোনো প্রভাব পড়বে না।', 'মুছে ফেলুন', true))) return;
        await S.store.deleteQuestion(q.id); S.sel.delete(q.id); U.toast('মুছে ফেলা হয়েছে'); render(true);
      };
      f2.addEventListener('submit', async ev => {
        ev.preventDefault();
        const more = ev.submitter && ev.submitter.dataset.more;
        const v = id => sh.querySelector(id).value.trim();
        const row = { id: q.id, class: +v('#qf-class'), subject: v('#qf-sub'), chapter: v('#qf-ch'), type, text: v('#qf-text'), marks: parseFloat(U.en(v('#qf-marks'))), difficulty: diff, source: v('#qf-src') };
        if (!row.subject) return U.toast('বিষয় লিখুন');
        if (!row.text) return U.toast('প্রশ্নের লেখা দিন');
        if (!(row.marks > 0)) return U.toast('নম্বর ঠিক নেই');
        if (type === 'mcq') {
          row.options = [...sh.querySelectorAll('.optin')].map(i => i.value.trim());
          if (row.options.some(o => !o)) return U.toast('চারটা অপশনই লিখুন');
          if (correct === '' || correct == null) return U.toast('সঠিক উত্তরের অক্ষরে চাপুন');
          row.answer = String(correct);
        } else {
          row.options = null; row.answer = v('#qf-answer');
          if (type === 'num' && !row.answer) return U.toast('সঠিক উত্তর লিখুন');
        }
        await busy(ev.submitter || f2.querySelector('button[type=submit]'), () => S.store.saveQuestion(row));
        U.toast(isNew ? 'প্রশ্নব্যাংকে যোগ হয়েছে' : 'সংরক্ষণ হয়েছে');
        if (more) { const all2 = await S.store.questions(); S.cache.questions = all2; questionForm(null, row); }
        else closeSheet();
        render(true);
      });
    });
  }

  function autoPickSheet() {
    const all = S.cache.questions, f = S.f.bk || {};
    const cls0 = +f.cls || (all[0] || {}).class || 5;
    openSheet(`<h3>অটো বাছাই</h3><p class="small mut" style="margin:-6px 0 12px">কত প্রশ্ন লাগবে বলুন, অ্যাপ বেছে দেবে। কম ব্যবহার হওয়া প্রশ্ন আগে আসবে, তাই একই প্রশ্ন বারবার আসবে না।</p>
      <div class="stack" id="ap">
        <div class="grid2">
          <div class="field"><label for="ap-class">শ্রেণি</label><select id="ap-class">${[...new Set(all.map(x => x.class))].sort((a, b) => a - b).map(c => `<option value="${c}" ${cls0 == c ? 'selected' : ''}>${U.cls(c)}</option>`).join('')}</select></div>
          <div class="field"><label for="ap-sub">বিষয়</label><select id="ap-sub"></select></div>
        </div>
        <div class="field"><label for="ap-ch">অধ্যায়</label><select id="ap-ch"></select></div>
        <div class="grid2" style="grid-template-columns:repeat(4,minmax(0,1fr))">${Object.entries(BTYPES).map(([k, l]) => `<div class="field"><label for="ap-${k}" style="font-size:12px">${l.replace('গণিতের উত্তর', 'গণিত')}</label><input id="ap-${k}" data-t="${k}" inputmode="numeric" value="${k === 'mcq' ? '৫' : k === 'num' ? '২' : k === 'written' ? '১' : '০'}" style="text-align:center"></div>`).join('')}</div>
        <div class="small mut" id="ap-avail"></div>
        <div class="acts"><button class="btn line" data-act="close">বাতিল</button><button class="btn" id="ap-go">${icon('check')}বেছে দাও</button></div>
      </div>`, sh => {
      const $ = id => sh.querySelector(id);
      const pool = () => all.filter(x => x.class == $('#ap-class').value && (!$('#ap-sub').value || x.subject === $('#ap-sub').value) && (!$('#ap-ch').value || x.chapter === $('#ap-ch').value));
      const fillSubs = () => { const s = [...new Set(all.filter(x => x.class == $('#ap-class').value).map(x => x.subject))]; $('#ap-sub').innerHTML = s.map(x => `<option ${x === f.sub ? 'selected' : ''}>${esc(x)}</option>`).join(''); fillChs(); };
      const fillChs = () => { const c = [...new Set(all.filter(x => x.class == $('#ap-class').value && x.subject === $('#ap-sub').value).map(x => x.chapter).filter(Boolean))]; $('#ap-ch').innerHTML = `<option value="">সব অধ্যায় মিলিয়ে</option>` + c.map(x => `<option ${x === f.ch ? 'selected' : ''}>${esc(x)}</option>`).join(''); avail(); };
      const avail = () => { const p = pool(); $('#ap-avail').textContent = 'ব্যাংকে আছে: ' + Object.entries(BTYPES).map(([k, l]) => l.replace('গণিতের উত্তর', 'গণিত') + ' ' + bn(p.filter(x => x.type === k).length)).join(', '); };
      $('#ap-class').onchange = fillSubs; $('#ap-sub').onchange = fillChs; $('#ap-ch').onchange = avail;
      fillSubs();
      $('#ap-go').onclick = () => {
        const p = pool(), picked = [];
        let short = 0;
        sh.querySelectorAll('[data-t]').forEach(inp => {
          const n = +U.en(inp.value) || 0;
          const cand = p.filter(x => x.type === inp.dataset.t).map(x => ({ x, r: Math.random() })).sort((a, b) => (a.x.used_count || 0) - (b.x.used_count || 0) || a.r - b.r).map(o => o.x);
          picked.push(...cand.slice(0, n)); short += Math.max(0, n - cand.length);
        });
        if (!picked.length) return U.toast('এই বাছাইয়ে কোনো প্রশ্ন পাওয়া যায়নি');
        S.sel = new Set(picked.map(x => x.id));
        S.f.bk = { cls: $('#ap-class').value, sub: $('#ap-sub').value, ch: $('#ap-ch').value, type: '', q: '' };
        closeSheet(); render(true);
        U.toast(`${bn(picked.length)}টি প্রশ্ন বাছা হয়েছে` + (short ? `, ${bn(short)}টি কম পড়েছে` : ''));
      };
    });
  }

  function testFromSelection() {
    const all = S.cache.questions, sel = all.filter(x => S.sel.has(x.id));
    const classes = [...new Set(sel.map(x => x.class))];
    if (classes.length > 1) return U.toast('এক টেস্টে একটাই শ্রেণির প্রশ্ন বাছুন');
    const chs = [...new Set(sel.map(x => x.chapter).filter(Boolean))];
    const d = new Date(Date.now() + 3 * 864e5); d.setHours(21, 0, 0, 0);
    S.draft = {
      _for: 'new', class: classes[0], subject: sel[0].subject, chapter: chs.length === 1 ? chs[0] : chs.slice(0, 3).join(', '),
      duration_min: Math.max(10, Math.min(120, Math.round(sel.reduce((t, x) => t + (x.type === 'mcq' ? 1 : x.type === 'num' ? 2 : x.type === 'short' ? 3 : 6), 0) / 5) * 5)),
      due_at: d.toISOString(),
      questions: sel.map(x => ({ type: x.type === 'short' ? 'written' : x.type, text: x.text, marks: x.marks, options: x.type === 'mcq' ? x.options.slice() : ['', '', '', ''], ans: x.type === 'mcq' || x.type === 'num' ? x.answer : '', bank_id: x.id }))
    };
    S.sel = new Set();
    go('testEdit', {});
    U.toast('প্রশ্নগুলো বসানো হয়েছে, দেখে নিয়ে সংরক্ষণ করুন');
  }

  function paperHtml(qs, o) {
    const total = qs.reduce((t, x) => t + (+x.marks || 0), 0);
    const groups = [['mcq', 'বহুনির্বাচনী প্রশ্ন', 'সঠিক উত্তরটি বেছে লেখো'], ['num', 'গাণিতিক প্রশ্ন', 'উত্তর নির্ণয় করো'], ['short', 'সংক্ষিপ্ত প্রশ্ন', 'সংক্ষেপে উত্তর দাও'], ['written', 'রচনামূলক প্রশ্ন', 'বিস্তারিত উত্তর দাও']];
    const letters = ['ক', 'খ', 'গ', 'ঘ'];
    let n = 0, sec = 0;
    const body = groups.map(([t, h, sub]) => {
      const g = qs.filter(x => x.type === t); if (!g.length) return '';
      const m = g.reduce((s, x) => s + (+x.marks || 0), 0);
      return `<div class="sect"><span>${letters[sec++]}) ${h} <small>(${sub})</small></span><span>${bn(g.length)} × ${U.marks(g[0].marks)}${g.every(x => x.marks == g[0].marks) ? '' : '*'} = ${U.marks(m)}</span></div>
        <ol class="qs" start="${n + 1}">${g.map(x => { n++; return `<li><div class="qt">${esc(x.text)}<span class="mk">${U.marks(x.marks)}</span></div>${t === 'mcq' ? `<div class="opts">${x.options.map((op, j) => `<span>${OPT[j]}) ${esc(op)}</span>`).join('')}</div>` : ''}</li>`; }).join('')}</ol>`;
    }).join('');
    let k = 0;
    const key = o.key ? `<div class="pb"></div><div class="band"><div class="lg">${U.LOGO}</div><div class="nm"><b>একাডেমিক কেয়ার</b>${esc(o.program)}</div><div class="tt"><b>উত্তরমালা</b><span>${esc(o.title)}</span></div></div>
      <table class="t"><tr><th>প্রশ্ন</th><th>উত্তর</th></tr>${groups.flatMap(([t]) => qs.filter(x => x.type === t)).map(x => { k++; return `<tr><td>${bn(k)}</td><td>${x.type === 'mcq' ? OPT[+x.answer] + ') ' + esc(x.options[+x.answer] || '') : esc(x.answer || '–')}</td></tr>`; }).join('')}</table>` : '';
    return `<!doctype html><html lang="bn"><head><meta charset="utf-8"><title>${esc(o.title)}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&display=swap">

  function paperSheet() {
    const all = S.cache.questions, sel = all.filter(x => S.sel.has(x.id));
    const classes = [...new Set(sel.map(x => x.class))], subs = [...new Set(sel.map(x => x.subject))];
    const total = sel.reduce((t, x) => t + (+x.marks || 0), 0);
    openSheet(`<h3>প্রশ্নপত্র তৈরি</h3>
      <div class="stack">
        <div class="field"><label for="pp-title">পরীক্ষার নাম</label><input id="pp-title" value="সাপ্তাহিক পরীক্ষা"></div>
        <div class="field"><label for="pp-prog">শ্রেণি ও বিষয়</label><input id="pp-prog" value="${esc(classes.map(U.cls).join(', ') + ' · ' + subs.join(', '))}"></div>
        <div class="grid2">
          <div class="field"><label for="pp-time">সময়</label><input id="pp-time" value="${bn(Math.max(20, Math.round(total * 1.5 / 5) * 5))} মিনিট"></div>
          <div class="field"><label>পূর্ণমান</label><input value="${U.marks(total)}" disabled></div>
        </div>
        <label class="row small"><input type="checkbox" id="pp-key" checked style="width:20px;height:20px"> শেষ পাতায় উত্তরমালা রাখুন (শিক্ষকের কপি)</label>
        <div class="acts"><button class="btn line" id="pp-prev">${icon('search')}দেখুন</button><button class="btn" id="pp-print">${icon('download')}প্রিন্ট / PDF</button></div>
        <div id="pp-frame"></div>
      </div>`, sh => {
      const opts = () => ({ title: sh.querySelector('#pp-title').value.trim() || 'পরীক্ষা', program: sh.querySelector('#pp-prog').value.trim(), time: sh.querySelector('#pp-time').value.trim(), key: sh.querySelector('#pp-key').checked });
      const preview = () => {
        sh.querySelector('#pp-frame').innerHTML = `<iframe title="প্রশ্নপত্র" style="width:100%;height:60vh;border:1.5px solid var(--line);border-radius:12px;background:#fff"></iframe>`;
        sh.querySelector('iframe').srcdoc = paperHtml(sel, opts());
      };
      sh.querySelector('#pp-prev').onclick = preview;
      sh.querySelector('#pp-print').onclick = async () => {
        const html = paperHtml(sel, opts());
        S.store.markQuestionsUsed(sel.map(x => x.id)).catch(() => {});
        let w = null;
        try { w = window.open('', '_blank'); } catch (e) { }

  const time12 = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return bn(((h + 11) % 12) + 1) + ':' + bn(String(m).padStart(2, '0')) + (h < 12 ? ' সকাল' : h < 16 ? ' দুপুর' : h < 18 ? ' বিকেল' : ' সন্ধ্যা'); };

      await S.store.saveAttendance(day, rows);

  async function qrScanSheet() {
    if (isDemo()) return U.toast('ডেমোতে ক্যামেরা চালু হয় না। আসল অ্যাপে ছাত্রের QR কার্ড ক্যামেরার সামনে ধরলেই উপস্থিত হয়ে যাবে।');
    const byCode = Object.fromEntries(S.cache.students.filter(s => s.login_code).map(s => [s.login_code, s]));
    let stream = null, stop = false, last = '', lastAt = 0, count = 0;
    const sh = openSheet(`<h3>QR স্ক্যান</h3><p class="small mut" style="margin:-6px 0 10px">ছাত্রের কার্ড ক্যামেরার সামনে ধরুন। একজনের পর একজন স্ক্যান করতে থাকুন।</p>
      <div style="position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:3/4;max-width:100%"><video id="qr-v" playsinline muted style="width:100%;height:100%;object-fit:cover"></video><div style="position:absolute;inset:18%;border:3px solid #f6c24a;border-radius:18px"></div></div>
      <div id="qr-log" class="small" style="margin-top:10px;min-height:40px"></div>
      <div class="acts"><button class="btn" data-act="close">শেষ (${'<span id="qr-n">০</span>'} জন)</button></div>`);
    const cleanup = () => { stop = true; if (stream) stream.getTracks().forEach(t => t.stop()); };
    S.onSheetClose = () => { cleanup(); render(true); };
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const v = sh.querySelector('#qr-v'); v.srcObject = stream; await v.play();
      let detect;
      if ('BarcodeDetector' in window) { const bd = new BarcodeDetector({ formats: ['qr_code'] }); detect = async () => ((await bd.detect(v))[0] || {}).rawValue; }
      else {
        const jsQR = await loadLib('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js', 'jsQR');
        const c = document.createElement('canvas'), g = c.getContext('2d', { willReadFrequently: true });
        detect = async () => { c.width = v.videoWidth; c.height = v.videoHeight; if (!c.width) return null; g.drawImage(v, 0, 0); const r = jsQR(g.getImageData(0, 0, c.width, c.height).data, c.width, c.height); return r && r.data; };
      }
      const loop = async () => {
        if (stop) return;
        try {
          const txt = await detect();
          const code = txt && (txt.match(/AC-(\d{6})/) || [])[1];
          if (code && (code !== last || Date.now() - lastAt > 4000)) {
            last = code; lastAt = Date.now();
            const s = byCode[code];
            const log = sh.querySelector('#qr-log');
            if (s) {
              const already = S.att.marks[s.id] === 'present';
              S.att.marks[s.id] = 'present';
              if (!already) count++;
              sh.querySelector('#qr-n').textContent = bn(count);
              log.innerHTML = `<b class="up">✓ ${esc(s.name)}</b> ${already ? 'আগেই উপস্থিত' : 'উপস্থিত'}`;
              try { navigator.vibrate && navigator.vibrate(80); } catch (e) { }
            } else log.innerHTML = '<b class="down">এই কার্ড চেনা যায়নি</b>';
          }
        } catch (e) { }
        setTimeout(loop, 250);
      };
      loop();
    } catch (e) {
      sh.querySelector('#qr-log').innerHTML = '<span class="down">ক্যামেরা চালু করা যায়নি। ফোনের সেটিং থেকে এই সাইটকে ক্যামেরার অনুমতি দিন।</span>';
    }
  }

@page{size:A4;margin:10mm}*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Noto Sans Bengali","FreeSans",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#fff}

  // ---------- মাসিক রিপোর্ট কার্ড ----------
  async function monthData(k, month) {
    const [rows, att, hws, subs, pays, merit, comment, tests, attempts] = await Promise.all([
      S.store.report(k.id), S.store.attendance({ month }), S.store.homework(), S.store.submissions(), S.store.payments(month),
      S.store.meritList(k.class, month).catch(() => []), S.store.reportComment(k.id, month).catch(() => ''), S.store.tests(), S.store.attempts()]);
    const ex = rows.filter(r => r.exam_date.startsWith(month));
    const done = ex.filter(r => !r.absent && r.pct != null);
    const avg = done.length ? done.reduce((t, r) => t + r.pct, 0) / done.length : null;
    const myAtt = att.filter(a => a.student_id === k.id);
    const present = myAtt.filter(a => a.status !== 'absent').length;
    const hwM = hws.filter(h => h.class === k.class && h.due_date.startsWith(month));
    const hwDone = hwM.filter(h => subs.some(x => x.homework_id === h.id && x.student_id === k.id)).length;
    const testsM = tests.filter(t => t.class === k.class && attempts.some(a => a.test_id === t.id && a.student_id === k.id && a.submitted_at && a.submitted_at.startsWith(month)));
    const me = merit.find(m => m.student_id === k.id);
    const fee = feeStatus(k, month, pays);
    const badges = [];
    if (me && me.rank === 1) badges.push(['trophy', 'মাসের সেরা', 'ক্লাসে প্রথম']);
    else if (me && me.rank <= 3) badges.push(['trophy', 'সেরা তিনে', 'ক্লাসে ' + ordinal(me.rank)]);
    if (me && me.most_improved) badges.push(['chart', 'সবচেয়ে বেশি উন্নতি', '▲ ' + U.pct(me.improve)]);
    if (myAtt.length >= 8 && !myAtt.some(a => a.status === 'absent')) badges.push(['check', 'পূর্ণ উপস্থিতি', 'একদিনও অনুপস্থিত নয়']);
    if (hwM.length >= 2 && hwDone === hwM.length) badges.push(['edit', 'সব হোমওয়ার্ক জমা', bn(hwM.length) + 'টির সবকটি']);
    if (onTime(fee.p)) badges.push(['wallet', 'সময়মতো বেতন', bn(dueDay()) + ' তারিখের মধ্যে']);
    return { ex, avg, myAtt, present, hwM, hwDone, testsM, me, merit, comment, fee, badges, attempts };
  }
  const badgeHtml = b => `<div class="badge2"><span class="bi">${icon(b[0])}</span><span><b>${b[1]}</b><small>${b[2]}</small></span></div>`;

    month = month || S.f.repMonth || U.monthKey();
    S.cache = { reportKid: k, reportMonth: month };
    const D = await monthData(k, month);
